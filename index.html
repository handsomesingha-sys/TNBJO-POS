<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17352c">
  <meta name="description" content="สั่งอาหารร้านก๋วยเตี๋ยวโบราณ by เจ๊อ้น ผ่าน LINE">
  <title>ก๋วยเตี๋ยวโบราณ by เจ๊อ้น</title>

  <!-- Modern Thai-friendly typeface -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- LINE LIFF SDK, QR renderer, and QR camera scanner -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>

  <style>
    :root {
      --ink: #1e2d27;
      --muted: #7d8982;
      --muted-2: #a5aea8;
      --brand: #1e4a3c;
      --brand-2: #2e715a;
      --brand-soft: #edf5ef;
      --lime: #b9d7a8;
      --paper: #f7f8f5;
      --surface: #ffffff;
      --line: #e9ede8;
      --danger: #c84b4b;
      --warning: #b7791f;
      --shadow: 0 16px 42px rgba(28, 49, 39, .10);
      --radius-lg: 22px;
      --radius-md: 16px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--paper); scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--paper);
      font-family: 'DM Sans', 'Kanit', sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    img { max-width: 100%; display: block; }
    .hidden { display: none !important; }

    /* Loading / boot state */
    .loading-screen {
      position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center;
      padding: 24px; background: #f7f8f5; transition: opacity .25s ease, visibility .25s ease;
    }
    .loading-screen.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .loading-inner { display: flex; flex-direction: column; align-items: center; gap: 17px; text-align: center; }
    .loader-mark {
      position: relative; width: 70px; height: 70px; display: grid; place-items: center;
      border-radius: 24px; background: #17352c; color: #fff; box-shadow: 0 12px 28px rgba(23, 53, 44, .18);
    }
    .loader-mark::after {
      content: ''; position: absolute; inset: -8px; border-radius: 30px;
      border: 2px solid transparent; border-top-color: #6f9e7e; border-right-color: #c2d9b8;
      animation: spin 1.05s linear infinite;
    }
    .loader-mark svg { width: 31px; height: 31px; }
    .loading-title { font-family: 'Kanit', sans-serif; font-weight: 500; font-size: 19px; letter-spacing: -.2px; }
    .loading-caption { color: var(--muted); font-size: 12px; }
    .loading-error { max-width: 340px; color: var(--danger); font-size: 13px; line-height: 1.6; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* App shell */
    .app-shell { width: min(100%, 760px); min-height: 100vh; margin: 0 auto; padding-bottom: calc(88px + var(--safe-bottom)); }
    .topbar {
      position: sticky; top: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 13px 18px 12px; background: rgba(247, 248, 245, .93);
      backdrop-filter: blur(18px); border-bottom: 1px solid rgba(230, 235, 229, .75);
    }
    .brand-wrap { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-logo { width: 42px; height: 42px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 14px; color: white; background: var(--brand); }
    .brand-logo svg { width: 23px; height: 23px; }
    .brand-name { overflow: hidden; font-family: 'Kanit', sans-serif; font-weight: 500; font-size: 16px; white-space: nowrap; text-overflow: ellipsis; }
    .brand-subtitle { margin-top: 1px; color: var(--muted); font-size: 10px; letter-spacing: .3px; }
    .icon-button {
      position: relative; width: 42px; height: 42px; display: grid; place-items: center; flex: 0 0 auto;
      border: 1px solid var(--line); border-radius: 15px; background: var(--surface); color: var(--ink);
    }
    .icon-button svg { width: 20px; height: 20px; }
    .cart-count { position: absolute; top: -5px; right: -5px; min-width: 19px; height: 19px; display: grid; place-items: center; padding: 0 5px; border: 2px solid var(--paper); border-radius: 20px; background: #dd624f; color: #fff; font-size: 10px; font-weight: 700; }

    .page { padding: 17px 16px 24px; animation: fadeUp .22s ease both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .greeting-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; margin: 3px 1px 17px; }
    .eyebrow { color: var(--brand-2); font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    .page-title { margin: 4px 0 0; font-family: 'Kanit', sans-serif; font-size: 25px; line-height: 1.3; font-weight: 500; letter-spacing: -.3px; }
    .page-desc { margin: 6px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .avatar { width: 44px; height: 44px; flex: 0 0 auto; border-radius: 50%; object-fit: cover; background: #dce8dd; }
    .avatar-fallback { display: grid; place-items: center; color: var(--brand); font-weight: 700; }

    .hero-card {
      position: relative; overflow: hidden; min-height: 150px; padding: 20px; border-radius: 23px;
      color: #fff; background: linear-gradient(125deg, #183a30 0%, #285d49 62%, #668963 100%);
      box-shadow: 0 14px 28px rgba(30, 74, 60, .17);
    }
    .hero-card::before, .hero-card::after { content: ''; position: absolute; border-radius: 50%; border: 1px solid rgba(255,255,255,.13); }
    .hero-card::before { width: 190px; height: 190px; right: -54px; top: -75px; }
    .hero-card::after { width: 130px; height: 130px; right: -20px; top: -42px; }
    .hero-content { position: relative; z-index: 1; max-width: 75%; }
    .hero-kicker { color: #d6e8d8; font-size: 11px; font-weight: 600; letter-spacing: .7px; }
    .hero-title { margin: 6px 0 5px; font-family: 'Kanit', sans-serif; font-weight: 500; font-size: 22px; line-height: 1.3; }
    .hero-copy { margin: 0; color: rgba(255,255,255,.76); font-size: 11px; line-height: 1.6; }
    .hero-illustration { position: absolute; right: 16px; bottom: 10px; width: 100px; height: 100px; display: grid; place-items: center; opacity: .98; }
    .hero-illustration svg { width: 100%; height: 100%; }

    .search-box { display: flex; align-items: center; gap: 10px; margin: 16px 0 20px; padding: 0 14px; height: 49px; border: 1px solid var(--line); border-radius: 16px; background: #fff; box-shadow: 0 5px 15px rgba(30,45,39,.025); }
    .search-box svg { width: 19px; height: 19px; color: #89958e; flex: 0 0 auto; }
    .search-box input { width: 100%; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 13px; }
    .search-box input::placeholder { color: #a7b0aa; }
    .section-heading { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 21px 1px 12px; }
    .section-title { margin: 0; font-family: 'Kanit', sans-serif; font-size: 17px; font-weight: 500; }
    .section-link { padding: 3px 0; border: 0; color: var(--brand-2); background: transparent; font-size: 11px; font-weight: 700; }
    .category-row { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 5px; scrollbar-width: none; }
    .category-row::-webkit-scrollbar { display: none; }
    .category-chip { flex: 0 0 auto; padding: 9px 14px; border: 1px solid var(--line); border-radius: 30px; background: #fff; color: #68756d; font-size: 11px; font-weight: 600; }
    .category-chip.active { border-color: var(--brand); background: var(--brand); color: #fff; }

    .product-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .product-card { overflow: hidden; border: 1px solid #edf0eb; border-radius: 18px; background: #fff; box-shadow: 0 5px 15px rgba(30,45,39,.035); transition: transform .15s ease, box-shadow .15s ease; }
    .product-card:active { transform: scale(.985); }
    .product-image-wrap { position: relative; overflow: hidden; aspect-ratio: 1.23 / 1; background: #eef1eb; }
    .product-image { width: 100%; height: 100%; object-fit: cover; }
    .product-placeholder { width: 100%; height: 100%; display: grid; place-items: center; color: #9ca99f; background: linear-gradient(145deg,#eef2eb,#e4ebe2); }
    .product-placeholder svg { width: 38px; height: 38px; }
    .product-tag { position: absolute; top: 9px; left: 9px; padding: 5px 8px; border-radius: 20px; background: rgba(255,255,255,.94); color: var(--brand); font-size: 9px; font-weight: 800; }
    .product-unavailable { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(28,40,33,.38); color: #fff; font-size: 12px; font-weight: 700; }
    .product-info { padding: 10px 11px 11px; }
    .product-name { min-height: 40px; margin: 0; display: -webkit-box; overflow: hidden; -webkit-box-orient: vertical; -webkit-line-clamp: 2; font-family: 'Kanit', sans-serif; font-size: 14px; line-height: 1.4; font-weight: 400; }
    .product-desc { overflow: hidden; margin: 3px 0 8px; color: var(--muted); font-size: 10px; white-space: nowrap; text-overflow: ellipsis; }
    .product-footer { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .price { color: var(--brand); font-size: 14px; font-weight: 800; }
    .add-mini { width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 11px; color: #fff; background: var(--brand); }
    .add-mini svg { width: 17px; height: 17px; }
    .empty-state { padding: 38px 16px; text-align: center; color: var(--muted); }
    .empty-state svg { width: 43px; height: 43px; margin: 0 auto 11px; color: #aab7ac; }
    .empty-state strong { display: block; margin-bottom: 5px; color: var(--ink); font-family: 'Kanit', sans-serif; font-weight: 500; }

    /* Bottom navigation */
    .bottom-nav {
      position: fixed; z-index: 40; left: 50%; bottom: 0; transform: translateX(-50%); width: min(100%,760px);
      display: grid; grid-template-columns: repeat(5,1fr); padding: 8px 9px calc(8px + var(--safe-bottom));
      border-top: 1px solid rgba(230,235,229,.9); background: rgba(255,255,255,.96); backdrop-filter: blur(16px);
    }
    .nav-item { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 51px; border: 0; border-radius: 13px; background: transparent; color: #929c95; font-size: 9px; font-weight: 600; }
    .nav-item svg { width: 21px; height: 21px; stroke-width: 1.8; }
    .nav-item.active { color: var(--brand); }
    .nav-item.active::before { content: ''; position: absolute; top: -8px; width: 23px; height: 3px; border-radius: 0 0 4px 4px; background: var(--brand-2); }
    .nav-badge { position: absolute; top: 0; right: calc(50% - 22px); min-width: 16px; height: 16px; padding: 0 4px; display: grid; place-items: center; border-radius: 20px; background: #df6652; color: white; font-size: 9px; }

    /* Shared controls */
    .primary-btn, .secondary-btn, .danger-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 17px;
      border: 0; border-radius: 14px; font-size: 13px; font-weight: 700; transition: transform .12s ease, opacity .12s ease;
    }
    .primary-btn { color: #fff; background: var(--brand); box-shadow: 0 6px 14px rgba(30,74,60,.13); }
    .secondary-btn { color: var(--brand); background: var(--brand-soft); border: 1px solid #e1ece2; }
    .danger-btn { color: #a83e3e; background: #fff0ef; }
    .primary-btn:active, .secondary-btn:active, .danger-btn:active { transform: scale(.985); }
    .full-width { width: 100%; }
    .muted { color: var(--muted); }
    .small { font-size: 11px; }
    .money { font-variant-numeric: tabular-nums; }
    .divider { height: 1px; background: var(--line); margin: 13px 0; }
    .field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 13px; }
    .field label { color: #5e6b63; font-size: 11px; font-weight: 700; }
    .field input, .field textarea, .field select {
      width: 100%; min-height: 45px; padding: 11px 13px; border: 1px solid #e4eae3; border-radius: 13px;
      outline: 0; color: var(--ink); background: #fff; font-size: 13px;
    }
    .field textarea { min-height: 76px; resize: vertical; }
    .field input:focus, .field textarea:focus, .field select:focus { border-color: #86a992; box-shadow: 0 0 0 3px rgba(66,130,93,.08); }
    .pill { display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px; border-radius: 30px; background: var(--brand-soft); color: var(--brand-2); font-size: 10px; font-weight: 700; }

    /* Cart and order lists */
    .list-card { padding: 13px; border: 1px solid var(--line); border-radius: 17px; background: #fff; }
    .cart-row { display: grid; grid-template-columns: 66px minmax(0,1fr) auto; align-items: start; gap: 11px; }
    .cart-thumb { width: 66px; height: 66px; border-radius: 13px; object-fit: cover; background: #edf1ea; }
    .cart-item-name { margin: 0; font-family: 'Kanit', sans-serif; font-size: 14px; font-weight: 400; }
    .cart-item-options { margin: 4px 0 0; color: var(--muted); font-size: 10px; line-height: 1.6; }
    .quantity-control { display: inline-flex; align-items: center; gap: 9px; margin-top: 8px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; }
    .quantity-control button { width: 25px; height: 25px; display: grid; place-items: center; border: 0; border-radius: 7px; color: var(--brand); background: #f0f5f0; font-weight: 700; }
    .quantity-control span { min-width: 15px; text-align: center; font-size: 11px; font-weight: 700; }
    .order-card { padding: 14px; border: 1px solid var(--line); border-radius: 17px; background: #fff; }
    .order-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .order-id { font-weight: 800; font-size: 12px; }
    .status-pill { padding: 5px 9px; border-radius: 30px; background: #edf4ed; color: #38734e; font-size: 10px; font-weight: 700; white-space: nowrap; }
    .status-pill.pending { background: #fff4df; color: #a66e16; }
    .status-pill.cancelled { background: #ffeded; color: #b64b4b; }
    .order-items-text { margin: 10px 0; color: #78857c; font-size: 11px; line-height: 1.7; }
    .order-card-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }

    /* Other / points */
    .menu-option { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px; border: 1px solid var(--line); border-radius: 16px; background: #fff; text-align: left; }
    .menu-option + .menu-option { margin-top: 9px; }
    .option-icon { width: 42px; height: 42px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 13px; color: var(--brand); background: var(--brand-soft); }
    .option-icon svg { width: 20px; height: 20px; }
    .menu-option strong { display: block; font-family: 'Kanit', sans-serif; font-weight: 400; font-size: 14px; }
    .menu-option small { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; }
    .menu-option .chevron { margin-left: auto; color: #9da9a0; }
    .points-card { overflow: hidden; position: relative; padding: 20px; border-radius: 23px; color: #fff; background: linear-gradient(135deg,#17362c,#2c684d); }
    .points-card::after { content: ''; position: absolute; width: 190px; height: 190px; top: -86px; right: -64px; border: 1px solid rgba(255,255,255,.14); border-radius: 50%; box-shadow: 0 0 0 22px rgba(255,255,255,.035),0 0 0 46px rgba(255,255,255,.025); }
    .points-number { margin: 8px 0 0; font-family: 'DM Sans', sans-serif; font-size: 41px; font-weight: 800; letter-spacing: -1.5px; line-height: 1; }
    .points-progress { height: 6px; margin-top: 15px; overflow: hidden; border-radius: 8px; background: rgba(255,255,255,.22); }
    .points-progress span { display: block; height: 100%; border-radius: 8px; background: #bde0a9; }
    .qr-panel { padding: 18px 14px; border: 1px solid var(--line); border-radius: 20px; background: #fff; text-align: center; }
    #customerQrCanvas { width: 210px; height: 210px; display: grid; place-items: center; margin: 13px auto 9px; padding: 9px; border: 1px solid #edf0eb; border-radius: 14px; background: #fff; }
    #customerQrCanvas img, #customerQrCanvas canvas { max-width: 100%; max-height: 100%; }
    .qr-obscured { filter: blur(7px); opacity: .28; transition: filter .25s ease, opacity .25s ease; }
    .qr-result-icon { width: 72px; height: 72px; display: grid; place-items: center; margin: 16px auto 9px; border-radius: 50%; color: #fff; background: #64c87a; box-shadow: 0 8px 20px rgba(74,185,100,.18); }
    .qr-result-icon svg { width: 37px; height: 37px; stroke-width: 2.5; }
    .history-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .history-row:last-child { border-bottom: 0; }
    .history-title { font-size: 12px; font-weight: 700; }
    .history-meta { margin-top: 4px; color: var(--muted); font-size: 10px; }
    .points-positive { color: #31955b; font-size: 13px; font-weight: 800; }
    .points-negative { color: #bd5c53; font-size: 13px; font-weight: 800; }
    .reward-card { display: grid; grid-template-columns: 72px minmax(0,1fr) auto; align-items: center; gap: 11px; padding: 11px; border: 1px solid var(--line); border-radius: 16px; background: #fff; }
    .reward-image { width: 72px; height: 72px; border-radius: 12px; object-fit: cover; background: #edf1ea; }
    .reward-name { margin: 0 0 4px; font-family: 'Kanit', sans-serif; font-size: 13px; font-weight: 400; }
    .reward-cost { color: var(--brand-2); font-size: 11px; font-weight: 800; }

    /* Modal */
    .modal-backdrop { position: fixed; inset: 0; z-index: 100; display: flex; align-items: flex-end; justify-content: center; padding: 12px; background: rgba(16,29,23,.42); backdrop-filter: blur(5px); animation: backdropIn .16s ease; }
    .modal-backdrop.center { align-items: center; }
    @keyframes backdropIn { from { opacity: 0; } to { opacity: 1; } }
    .modal-card { width: min(100%, 520px); max-height: min(88vh, 800px); overflow: hidden; display: flex; flex-direction: column; border-radius: 24px; background: #fff; box-shadow: var(--shadow); animation: modalIn .2s ease; }
    @keyframes modalIn { from { opacity: .6; transform: translateY(12px) scale(.99); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .modal-card.center-modal { width: min(100%, 390px); border-radius: 22px; }
    .modal-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
    .modal-title { margin: 0; font-family: 'Kanit', sans-serif; font-size: 17px; font-weight: 500; }
    .modal-close { width: 34px; height: 34px; display: grid; place-items: center; border: 0; border-radius: 11px; color: #68766d; background: #f1f4f0; }
    .modal-body { overflow-y: auto; padding: 16px 18px 18px; }
    .modal-footer { display: flex; gap: 9px; padding: 12px 18px calc(14px + var(--safe-bottom)); border-top: 1px solid var(--line); background: #fff; }
    .modal-footer > * { flex: 1; }
    .modal-product-head { display: grid; grid-template-columns: 92px 1fr; gap: 13px; margin-bottom: 15px; }
    .modal-product-head img, .modal-product-head .product-placeholder { width: 92px; height: 92px; border-radius: 14px; object-fit: cover; }
    .modal-product-name { margin: 2px 0 4px; font-family: 'Kanit', sans-serif; font-size: 18px; font-weight: 500; }
    .option-group { padding: 14px 0; border-top: 1px solid var(--line); }
    .option-group-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .option-group-title { margin: 0; font-family: 'Kanit', sans-serif; font-size: 14px; font-weight: 500; }
    .option-required { padding: 4px 7px; border-radius: 7px; color: #a66e16; background: #fff5df; font-size: 9px; font-weight: 700; }
    .option-choice { display: flex; align-items: center; gap: 9px; padding: 10px 0; border-bottom: 1px solid #f1f3ef; font-size: 12px; }
    .option-choice:last-child { border-bottom: 0; }
    .option-choice input { width: 17px; height: 17px; accent-color: var(--brand); }
    .option-choice .choice-price { margin-left: auto; color: var(--brand-2); font-size: 11px; font-weight: 700; }
    .toast-wrap { position: fixed; z-index: 300; top: 16px; left: 50%; transform: translateX(-50%); width: min(calc(100% - 28px), 420px); pointer-events: none; }
    .toast { display: flex; align-items: center; gap: 10px; padding: 13px 15px; border-radius: 14px; color: #fff; background: #263d32; box-shadow: 0 12px 30px rgba(0,0,0,.16); font-size: 12px; line-height: 1.5; animation: toastIn .2s ease; }
    .toast.error { background: #963f3b; }
    .toast svg { width: 19px; height: 19px; flex: 0 0 auto; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    .scanner-box { min-height: 250px; overflow: hidden; border-radius: 15px; background: #111; }
    #qrReader { width: 100%; }
    #qrReader video { border-radius: 15px; object-fit: cover; }

    @media (min-width: 640px) {
      .page { padding: 22px 22px 30px; }
      .topbar { padding-left: 22px; padding-right: 22px; }
      .product-grid { grid-template-columns: repeat(3,minmax(0,1fr)); gap: 15px; }
      .product-image-wrap { aspect-ratio: 1.2/1; }
      .hero-card { min-height: 170px; padding: 24px; }
      .hero-title { font-size: 25px; }
      .hero-illustration { width: 122px; height: 122px; right: 28px; }

    }
    @media (max-width: 360px) {

      .nav-item { font-size: 8px; }
    }
  </style>
</head>
<body>
  <!-- Loading screen shown while LIFF and the API are initialized -->
  <div id="loadingScreen" class="loading-screen" role="status" aria-live="polite">
    <div class="loading-inner">
      <div class="loader-mark" aria-hidden="true">

          <path d="M3 10c1.3 0 1.3-1 2.7-1 1.3 0 1.3 1 2.6 1 1.4 0 1.4-1 2.7-1 1.3 0 1.3 1 2.7 1 1.3 0 1.3-1 2.6-1 1.4 0 1.4 1 2.7 1"/>

          <div class="brand-name">ก๋วยเตี๋ยวโบราณ by เจ๊อ้น</div>

    <nav class="bottom-nav" aria-label="เมนูหลัก">
      <button class="nav-item active" type="button" data-page="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>หน้าแรก</span>

      <button class="nav-item" type="button" data-page="orders">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10l3 3v15H4V3zM8 10h8M8 14h8M8 18h5"/></svg><span>ออเดอร์</span>
      </button>
      <button class="nav-item" type="button" data-page="cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.2 11.1a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="10" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg><span>ตะกร้า</span><span id="navCartCount" class="nav-badge hidden">0</span>
