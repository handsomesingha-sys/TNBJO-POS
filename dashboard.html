<script>
'use strict';

/* =====================================================================
   1. CONFIGURATION — replace API_URL with your Apps Script /exec URL.
   ===================================================================== */
const CONFIG = Object.freeze({
  API_URL: 'PASTE_GOOGLE_APPS_SCRIPT_WEB_APP_EXEC_URL_HERE',
  API_TIMEOUT_MS: 35000,
  REQUEST_POLL_INTERVAL_MS: 900,

const STATUS_LABELS = {
  NEW: 'ออเดอร์ใหม่', ACCEPTED: 'รับออเดอร์แล้ว', PREPARING: 'กำลังปรุงอาหาร',
  READY: 'พร้อมรับอาหาร', COMPLETED: 'เสร็จสิ้น', CANCELLED: 'ยกเลิก'
};
const STATUS_FLOW = {
  NEW: ['ACCEPTED', 'PREPARING', 'CANCELLED'],
  ACCEPTED: ['PREPARING', 'CANCELLED'], PREPARING: ['READY', 'CANCELLED'],
  READY: ['COMPLETED', 'CANCELLED'], COMPLETED: [], CANCELLED: []
};
const PAGE_META = {
  overview: ['ภาพรวมร้าน', 'สรุปสถานะและยอดขายของร้านวันนี้'],
  orders: ['คำสั่งซื้อ', 'ตรวจสอบรายการและอัปเดตสถานะคำสั่งซื้อ'],
  menu: ['เมนูอาหาร', 'เพิ่ม แก้ไข และจัดการการแสดงเมนูให้ลูกค้า'],
  options: ['ตัวเลือกอาหาร', 'จัดกลุ่มตัวเลือก เช่น เส้น พิเศษ และเครื่องเพิ่มเติม'],
  customers: ['ลูกค้า', 'ค้นหาสมาชิกและจัดการแต้มสะสม'],
  loyalty: ['สะสมแต้ม / QR', 'สร้าง QR ร้านและรับ QR จากลูกค้าเพื่อสะสมแต้ม'],
  settings: ['ตั้งค่าร้าน', 'สถานะร้าน จำนวนออเดอร์ และการตั้งค่าระบบ']
};
const state = {
  token: '', page: 'overview', bootstrap: null, orders: [], orderFilter: 'ALL',
  menuFilter: 'ALL', customerQuery: '', customers: [], merchantQrPoll: null,
  merchantQrCountdown: null, scanner: null, refreshTimer: null
};
const $ = (selector, root = document) => root.querySelector(selector);
const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));

/* =====================================================================
   2. UTILITIES AND UI FEEDBACK
   ===================================================================== */
function escapeHtml(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[char]);
}
function money(value) {
  return new Intl.NumberFormat('th-TH', { maximumFractionDigits: 2 }).format(Number(value) || 0);
}
function dateTime(value) {
  if (!value) return '-';
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? '-' : new Intl.DateTimeFormat('th-TH', { dateStyle: 'medium', timeStyle: 'short' }).format(date);
}
function localDateTimeValue(value) {
  const date = value ? new Date(value) : new Date(Date.now() + 60 * 60 * 1000);
  if (Number.isNaN(date.getTime())) return '';
  return new Date(date.getTime() - date.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
}
function requestId() {
  if (window.crypto?.randomUUID) return crypto.randomUUID().replace(/-/g, '');
  const bytes = new Uint8Array(24);
  if (window.crypto?.getRandomValues) crypto.getRandomValues(bytes);
  else for (let i = 0; i < bytes.length; i++) bytes[i] = Math.floor(Math.random() * 256);
  return Array.from(bytes, value => value.toString(16).padStart(2, '0')).join('');
}
function safeImageUrl(value) {
  const url = String(value || '').trim();
  return /^https:\/\//i.test(url) ? url : '';
}
function placeholderImage() {
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300"><rect width="100%" height="100%" fill="#edf2ed"/><circle cx="240" cy="125" r="58" fill="#dce8de"/><path d="M160 190h160" stroke="#b9cdbd" stroke-width="12" stroke-linecap="round"/><text x="240" y="250" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#84968b">JAEON NOODLE</text></svg>';
  return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
}
function toast(message, type = 'success') {
  const node = document.createElement('div');
  node.className = `toast ${type === 'error' ? 'error' : 'success'}`;
  node.textContent = String(message || 'ดำเนินการเรียบร้อย');
  $('#toastRoot').appendChild(node);
  setTimeout(() => node.remove(), 3800);
}
function setLoading(show, message = 'กำลังดำเนินการ...') {
  $('#loadingText').textContent = message;
  $('#loadingOverlay').hidden = !show;
}
function showModal(title, body, footer = '', wide = false) {
  $('#modalRoot').innerHTML = `
    <div class="modal-backdrop" data-action="modal-backdrop"></div>
    <section class="modal-panel ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}">
      <header class="modal-head"><h3>${escapeHtml(title)}</h3><button class="modal-close" data-action="close-modal" aria-label="ปิด"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
      <div class="modal-body">${body}</div>${footer ? `<footer class="modal-foot">${footer}</footer>` : ''}
    </section>`;
  $('#modalRoot').hidden = false;
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  $('#modalRoot').hidden = true;
  $('#modalRoot').innerHTML = '';
  document.body.style.overflow = '';
}
function confirmAction(title, message, callback) {
  showModal(title, `<p style="margin:0;color:#657168;font-size:12px;line-height:1.8">${escapeHtml(message)}</p>`,
    '<button class="btn btn-secondary" data-action="close-modal">ยกเลิก</button><button class="btn btn-danger" id="confirmActionButton">ยืนยัน</button>');
  $('#confirmActionButton').addEventListener('click', async () => { closeModal(); await callback(); });
}
function emptyState(title, subtitle, symbol = '◫') {
  return `<div class="empty"><div class="empty-icon"><span style="font-size:22px">${symbol}</span></div><strong>${escapeHtml(title)}</strong><p>${escapeHtml(subtitle || '')}</p></div>`;
}
function statusBadge(status) {
  const code = STATUS_LABELS[status] ? status : 'NEW';
  return `<span class="status-badge status-${code}">${STATUS_LABELS[code]}</span>`;
}
function categoryName(categoryId) {
  const row = (state.bootstrap?.categories || []).find(item => String(item.categoryId) === String(categoryId));
  return row ? row.name : 'ไม่ระบุหมวดหมู่';
}

/* =====================================================================
   3. API TRANSPORT — identical to Code.gs POST + JSONP polling contract.
   ===================================================================== */
function assertApiConfigured() {
  if (!CONFIG.API_URL.startsWith('https://script.google.com/macros/s/') ||
      CONFIG.API_URL.includes('PASTE_') || !CONFIG.API_URL.endsWith('/exec')) {
    throw new Error('กรุณากำหนด API_URL ใน CONFIG ของ dashboard.html ให้เป็น Web App URL ที่ลงท้ายด้วย /exec');
  }
}
function jsonp(action, params = {}) {
  assertApiConfigured();
  return new Promise((resolve, reject) => {
    const callback = `__jaeonAdminGet_${Date.now()}_${Math.floor(Math.random() * 100000)}`;
    const query = new URLSearchParams({ action, ...params, callback, _: String(Date.now()) });
    const script = document.createElement('script');
    let done = false;
    const cleanup = () => { clearTimeout(timer); script.remove(); try { delete window[callback]; } catch (_) { window[callback] = undefined; } };
    const timer = setTimeout(() => { if (done) return; done = true; cleanup(); reject(new Error('หมดเวลารอการตอบกลับจากเซิร์ฟเวอร์')); }, CONFIG.API_TIMEOUT_MS);
    window[callback] = result => {
      if (done) return; done = true; cleanup();
      if (result?.ok === true) resolve(result);
      else reject(new Error(result?.message || 'ไม่สามารถโหลดข้อมูลได้'));
    };
    script.onerror = () => { if (done) return; done = true; cleanup(); reject(new Error('ไม่สามารถเชื่อมต่อ Google Apps Script ได้')); };
    script.src = `${CONFIG.API_URL}?${query.toString()}`;
    document.head.appendChild(script);
  });
}
async function pollResult(id) {
  for (let attempt = 0; attempt < CONFIG.REQUEST_POLL_ATTEMPTS; attempt++) {
    const result = await new Promise((resolve, reject) => {
      const callback = `__jaeonAdminPoll_${Date.now()}_${Math.floor(Math.random() * 100000)}`;
      const query = new URLSearchParams({ action: 'getRequestResult', requestId: id, callback, _: String(Date.now()) });
      const script = document.createElement('script');
      let done = false;
      const cleanup = () => { clearTimeout(timer); script.remove(); try { delete window[callback]; } catch (_) { window[callback] = undefined; } };
      const timer = setTimeout(() => { if (done) return; done = true; cleanup(); reject(new Error('หมดเวลารอผลการทำรายการ')); }, 7000);
      window[callback] = value => { if (done) return; done = true; cleanup(); resolve(value); };
      script.onerror = () => { if (done) return; done = true; cleanup(); reject(new Error('ไม่สามารถอ่านผลการทำรายการได้')); };
      script.src = `${CONFIG.API_URL}?${query.toString()}`;
      document.head.appendChild(script);
    });
    if (result?.pending) { await new Promise(resolve => setTimeout(resolve, CONFIG.REQUEST_POLL_INTERVAL_MS)); continue; }
    if (result?.ok !== true) throw new Error(result?.message || 'การทำรายการไม่สำเร็จ');
    return result;
  }
  throw new Error('เซิร์ฟเวอร์ใช้เวลานานเกินไป กรุณารีเฟรชและตรวจสอบข้อมูลก่อนทำรายการซ้ำ');
}
async function apiPost(action, payload = {}) {
  assertApiConfigured();
  const id = requestId();
  const body = JSON.stringify({ requestId: id, action, payload });
  try {
    await fetch(CONFIG.API_URL, {
      method: 'POST', mode: 'no-cors', redirect: 'follow', cache: 'no-store',
      headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body
    });
  } catch (_) { /* Result polling is the authoritative acknowledgement. */ }
  return pollResult(id);
}
function withSession(payload = {}) { return { ...payload, sessionToken: state.token }; }
async function adminPost(action, payload = {}) {
  if (!state.token && action !== 'adminLogin') throw new Error('กรุณาเข้าสู่ระบบใหม่อีกครั้ง');
  try { return await apiPost(action, action === 'adminLogin' ? payload : withSession(payload)); }
  catch (error) {
    if (/Session หมดอายุ|กรุณาเข้าสู่ระบบหลังบ้าน|ถูกยกเลิก/i.test(error.message || '')) {
      logout(false);
      toast('Session หมดอายุ กรุณาเข้าสู่ระบบใหม่', 'error');
    }
    throw error;
  }
}

/* =====================================================================
   4. LOGIN, APP INITIALIZATION, NAVIGATION AND REFRESH
   ===================================================================== */
async function login(password) {
  const button = $('#loginButton');
  button.disabled = true; button.textContent = 'กำลังตรวจสอบ...';
  try {
    const result = await apiPost('adminLogin', { password });
    if (!result.sessionToken) throw new Error('ระบบไม่ได้ส่ง Session กลับมา');
    state.token = result.sessionToken;
    sessionStorage.setItem(CONFIG.SESSION_KEY, state.token);
    $('#loginPassword').value = '';
    await enterApp();
  } catch (error) {
    if (state.token) logout(false);
    toast(error.message || 'เข้าสู่ระบบไม่สำเร็จ', 'error');
  }
  finally { button.disabled = false; button.textContent = 'เข้าสู่ระบบ'; }
}
async function loadBootstrap() {
  const result = await adminPost('getAdminBootstrap');
  state.bootstrap = result;
  const pending = Number(result.summary?.pendingOrders || 0);
  $('#pendingBadge').textContent = String(pending);
  $('#pendingBadge').hidden = pending < 1;
  updateStoreBadge();
}
async function enterApp() {
  setLoading(true, 'กำลังโหลดข้อมูลร้าน...');
  try {
    await loadBootstrap();
    $('#loginScreen').hidden = true;
    $('#appShell').hidden = false;
    navigate(state.page || 'overview');
    startAutoRefresh();
  } finally { setLoading(false); }
}
function updateStoreBadge() {
  const open = Boolean(state.bootstrap?.store?.isOpen);
  const node = $('#topbarStoreStatus');
  node.className = `status-pill ${open ? 'open' : 'closed'}`;
  node.textContent = open ? 'เปิดรับออเดอร์' : 'ปิดรับออเดอร์';
}
function logout(callApi = true) {
  const token = state.token;
  stopMerchantQrPolling(); stopScanner();
  if (callApi && token) apiPost('adminLogout', { sessionToken: token }).catch(() => {});
  state.token = ''; state.bootstrap = null;
  sessionStorage.removeItem(CONFIG.SESSION_KEY);
  if (state.refreshTimer) clearInterval(state.refreshTimer);
  $('#appShell').hidden = true; $('#loginScreen').hidden = false;
  $('#loginPassword').value = ''; $('#loginPassword').focus();
}
function navigate(page) {
  if (!PAGE_META[page]) page = 'overview';
  state.page = page;
  $$('.nav-button').forEach(button => button.classList.toggle('active', button.dataset.page === page));
  $('#topbarTitle').textContent = PAGE_META[page][0];
  $('#topbarSubtitle').textContent = PAGE_META[page][1];
  $('#sidebar').classList.remove('open'); $('#sidebarOverlay').classList.remove('show');
  renderPage();
}
function renderPage() {
  if (!state.bootstrap) return;
  switch (state.page) {
    case 'overview': renderOverview(); break;
    case 'orders': loadOrders(true); break;
    case 'menu': renderMenu(); break;
    case 'options': renderOptions(); break;
    case 'customers': loadCustomers(); break;
    case 'loyalty': renderLoyalty(); break;
    case 'settings': renderSettings(); break;
  }
}
function startAutoRefresh() {
  if (state.refreshTimer) clearInterval(state.refreshTimer);
  state.refreshTimer = setInterval(async () => {
    if (!state.token || document.hidden || !$('#modalRoot').hidden) return;
    try {
      await loadBootstrap();
      if (state.page === 'overview') renderOverview();
      if (state.page === 'orders') await loadOrders(false);
    } catch (_) { /* keep the current screen if background refresh fails */ }
  }, CONFIG.REFRESH_INTERVAL_MS);
}
async function refreshCurrentPage() {
  setLoading(true, 'กำลังอัปเดตข้อมูล...');
  try { await loadBootstrap(); renderPage(); toast('อัปเดตข้อมูลแล้ว'); }
  catch (error) { toast(error.message, 'error'); }
  finally { setLoading(false); }
}

  try {
    const result = await adminPost('getAdminOrders', { status: state.orderFilter, limit: 150 });
    state.orders = Array.isArray(result.orders) ? result.orders : [];
    renderOrders();
  } catch (error) {
    $('#pageContent').innerHTML = `<div class="page-heading"><h1>คำสั่งซื้อ</h1></div>${emptyState('โหลดคำสั่งซื้อไม่สำเร็จ', error.message)}`;

async function changeOrderStatus(orderId, status) {
  const label = STATUS_LABELS[status] || status;
  const execute = async () => {
    setLoading(true, 'กำลังเปลี่ยนสถานะคำสั่งซื้อ...');
    try {
      await adminPost('setOrderStatus', { orderId, status, description: label });
      closeModal(); await loadBootstrap();
      if (state.page === 'orders') await loadOrders(false); else renderOverview();
      toast(`อัปเดตสถานะเป็น “${label}” แล้ว`);
    } catch (error) { toast(error.message, 'error'); }
    finally { setLoading(false); }
  };
  if (status === 'CANCELLED') confirmAction('ยืนยันยกเลิกออเดอร์', 'ระบบจะเปลี่ยนสถานะและแจ้งลูกค้าผ่าน LINE', execute);
  else await execute();
}

async function compressImage(file, preserveTransparency = false) {
  if (!file || !file.type.startsWith('image/')) throw new Error('กรุณาเลือกไฟล์รูปภาพ');
  if (file.size > 15 * 1024 * 1024) throw new Error('ไฟล์ต้นฉบับมีขนาดใหญ่เกิน 15 MB');
  const dataUrl = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result));
    reader.onerror = () => reject(new Error('อ่านไฟล์รูปภาพไม่สำเร็จ'));
    reader.readAsDataURL(file);
  });
  const image = await new Promise((resolve, reject) => {
    const img = new Image(); img.onload = () => resolve(img); img.onerror = () => reject(new Error('เปิดรูปภาพไม่สำเร็จ')); img.src = dataUrl;
  });
  const maxEdge = preserveTransparency ? 1000 : 1500;
  const scale = Math.min(1, maxEdge / Math.max(image.width, image.height));
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(image.width * scale)); canvas.height = Math.max(1, Math.round(image.height * scale));
  const context = canvas.getContext('2d', { alpha: Boolean(preserveTransparency) });
  if (!preserveTransparency) { context.fillStyle = '#ffffff'; context.fillRect(0, 0, canvas.width, canvas.height); }
  context.drawImage(image, 0, 0, canvas.width, canvas.height);
  const compressed = preserveTransparency ? canvas.toDataURL('image/png') : canvas.toDataURL('image/jpeg', 0.82);
  const base64 = compressed.split(',')[1] || '';
  if (!base64 || base64.length > CONFIG.MAX_IMAGE_BASE64) throw new Error('รูปภาพหลังย่อแล้วยังมีขนาดใหญ่เกินไป กรุณาเลือกรูปที่เล็กลง');
  const extension = preserveTransparency ? '.png' : '.jpg';
  return { base64, fileName: (file.name || 'menu-photo').replace(/\.[^.]+$/, '') + extension, preview: compressed };
}
async function uploadMenuImage(event) {
  const file = event.target.files?.[0]; if (!file) return;

}
function stopScanner() {

}

async function createMerchantQr(event) {
  event.preventDefault(); const form = event.currentTarget; if (!form.reportValidity()) return;
  const button = $('#createMerchantQrButton'); button.disabled = true;
  try {
    stopMerchantQrPolling();
    const amount = Number(new FormData(form).get('amount'));
    const result = await adminPost('createMerchantLoyaltyQr', { amount });
    state.currentMerchantQr = result;
    renderMerchantQr(result);
    state.merchantQrPoll = setInterval(() => checkMerchantQrStatus(result.qrId), CONFIG.QR_POLL_INTERVAL_MS);
    state.merchantQrCountdown = setInterval(() => updateMerchantQrCountdown(result.expiresAt), 1000);
    toast(`สร้าง QR Code แล้ว · ลูกค้าจะได้รับ ${money(result.points)} แต้ม`);
  } catch (error) { toast(error.message, 'error'); }
  finally { button.disabled = false; }
}
function renderMerchantQr(qr) {
  const root = $('#merchantQrResult'); if (!root) return;
  root.innerHTML = `<div class="merchant-qr-card"><div id="merchantQrCanvas" class="merchant-qr-canvas"></div><strong>ยอดซื้อ ฿${money(qr.amount)}</strong><span>ลูกค้าจะได้รับ ${money(qr.points)} แต้ม</span><div class="qr-countdown" id="merchantQrCountdown">เหลือเวลา 05:00 นาที</div><div id="merchantQrMessage" class="muted" style="font-size:10px;margin-top:7px">รอลูกค้าสแกน QR Code...</div></div>`;
  const target = $('#merchantQrCanvas');
  if (window.QRCode) new QRCode(target, { text: qr.qrValue, width: 210, height: 210, colorDark: '#193d2e', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
  else target.innerHTML = `<p class="muted">กำลังโหลดตัวสร้าง QR Code กรุณารอสักครู่</p><code>${escapeHtml(qr.qrValue)}</code>`;
}
function updateMerchantQrCountdown(expiresAt) {
  const node = $('#merchantQrCountdown'); if (!node) return;
  const left = Math.max(0, Math.ceil((new Date(expiresAt).getTime() - Date.now()) / 1000));
  node.textContent = left > 0 ? `เหลือเวลา ${String(Math.floor(left / 60)).padStart(2, '0')}:${String(left % 60).padStart(2, '0')} นาที` : 'QR Code หมดอายุแล้ว';
}
async function checkMerchantQrStatus(qrId) {
  if (!state.currentMerchantQr || state.currentMerchantQr.qrId !== qrId) return;
  try {
    const result = await adminPost('getMerchantLoyaltyQrStatus', { qrId });
    const message = $('#merchantQrMessage'); const canvas = $('#merchantQrCanvas');
    if (!message || !canvas) { stopMerchantQrPolling(); return; }
    if (result.status === 'REDEEMED') {
      stopMerchantQrPolling(); canvas.classList.add('qr-blurred');
      message.innerHTML = `<div class="qr-success"><span class="success-check">✓</span><strong>สะสมแต้มสำเร็จ</strong><small>ลูกค้าได้รับ ${money(result.points)} แต้มแล้ว</small></div>`;
      toast('ลูกค้าสะสมแต้มสำเร็จแล้ว');
    } else if (result.status === 'EXPIRED') {
      stopMerchantQrPolling(); canvas.classList.add('qr-blurred');
      message.textContent = 'QR Code หมดอายุแล้ว กรุณาสร้าง QR Code ใหม่';
    }
  } catch (error) { if (/Session หมดอายุ|กรุณาเข้าสู่ระบบ/i.test(error.message)) stopMerchantQrPolling(); }
}
async function startScanner() {
  if (!window.Html5Qrcode) return toast('ตัวอ่าน QR ยังโหลดไม่สำเร็จ กรุณารีเฟรชหน้าเว็บ หรือใช้ช่องวางข้อความ QR', 'error');
  stopScanner();
  const target = $('#customerQrScanner'); target.innerHTML = '<div id="qrReader" style="width:100%"></div>';
  try {
    const scanner = new Html5Qrcode('qrReader'); state.scanner = scanner;
    await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 230, height: 230 }, aspectRatio: 1 }, async decodedText => {
      stopScanner(); $('#manualQrValue').value = decodedText;
      toast('อ่าน QR Code แล้ว กรุณากรอกยอดซื้อเพื่อยืนยัน');
      $('#manualQrAmount')?.focus();
    }, () => {});
  } catch (error) { state.scanner = null; target.innerHTML = '<p class="muted">เปิดกล้องไม่ได้ กรุณาอนุญาตการใช้กล้อง หรือวางข้อความ QR ด้วยตนเอง</p>'; toast('ไม่สามารถเปิดกล้องได้: ' + error.message, 'error'); }
}
async function redeemManualQr() {
  const qrValue = String($('#manualQrValue').value || '').trim(); const amount = Number($('#manualQrAmount').value);
  if (!qrValue) return toast('กรุณาสแกนหรือวาง QR Code ของลูกค้า', 'error');
  if (!amount || amount <= 0) return toast('กรุณากรอกยอดซื้อที่มากกว่า 0 บาท', 'error');
  setLoading(true, 'กำลังตรวจสอบ QR และบันทึกแต้ม...');
  try {
    const result = await adminPost('redeemCustomerLoyaltyQr', { qrValue, amount });
    $('#manualQrValue').value = ''; $('#manualQrAmount').value = '';
    $('#scanResult').innerHTML = `<div class="success-result"><span class="success-check">✓</span><div><strong>สะสมแต้มสำเร็จ</strong><p>ได้รับ ${money(result.pointsEarned)} แต้ม · คงเหลือ ${money(result.pointsBalance)} แต้ม</p><small>${escapeHtml(result.lineUserId)}</small></div></div>`;
    toast(`ให้แต้มลูกค้าสำเร็จ ${money(result.pointsEarned)} แต้ม`);
  } catch (error) { toast(error.message, 'error'); }
  finally { setLoading(false); }
}
async function saveLoyaltySettings(event) {
  event.preventDefault(); const form = event.currentTarget; if (!form.reportValidity()) return;
  const data = new FormData(form);
  try { await adminPost('saveLoyaltySettings', { pointsCurrencyStep: Number(data.get('pointsCurrencyStep')), pointsPerStep: Number(data.get('pointsPerStep')), minimumRedeemPoints: Number(data.get('minimumRedeemPoints')) }); await loadBootstrap(); renderLoyalty(); toast('บันทึกเงื่อนไขแต้มแล้ว'); }
  catch (error) { toast(error.message, 'error'); }
}

    <section class="panel"><div class="panel-head"><div><h3>เปลี่ยนรหัสผ่านหลังบ้าน</h3><p>รหัสใหม่ต้องมีอย่างน้อย 8 ตัวอักษร</p></div></div><form id="changePasswordForm"><label class="field"><span class="field-label">รหัสผ่านใหม่ *</span><input class="input" name="newPassword" type="password" minlength="8" autocomplete="new-password" required></label><label class="field"><span class="field-label">ยืนยันรหัสผ่านใหม่ *</span><input class="input" name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></label><button class="btn btn-primary" type="submit">เปลี่ยนรหัสผ่าน</button><p class="field-hint">เมื่อเปลี่ยนรหัสผ่าน ระบบจะยกเลิก Session ปัจจุบันและให้เข้าสู่ระบบใหม่</p></form></section>
  </div>`;
  $('#orderLimitForm').addEventListener('submit', saveOrderLimit);
  $('#generalSettingsForm').addEventListener('submit', saveGeneralSettings);
  $('#homeAppearanceForm').addEventListener('submit', saveHomeAppearance);
  $('#homeBannerFile').addEventListener('change', event => uploadHomeAsset(event, 'banner'));
  $('#brandLogoFile').addEventListener('change', event => uploadHomeAsset(event, 'logo'));
  $('#changePasswordForm').addEventListener('submit', changePassword);
}
function openCloseStoreForm() {
  const body = `<form id="closeStoreForm"><label class="field"><span class="field-label">เหตุผลที่ปิดรับออเดอร์ *</span><textarea class="textarea" name="reason" maxlength="300" required placeholder="เช่น เนื่องจากลูกค้าจำนวนมาก ขออภัยในความไม่สะดวก"></textarea><small class="field-hint">ข้อความนี้จะแสดงให้ลูกค้าเห็นในหน้า Mini App</small></label><label class="field"><span class="field-label">กำหนดเวลาเปิดรับอีกครั้ง (ไม่บังคับ)</span><input class="input" name="reopenAt" type="datetime-local" min="${localDateTimeValue(new Date())}"><small class="field-hint">เมื่อถึงเวลาที่กำหนด ระบบจะเปิดรับออเดอร์ให้อัตโนมัติ</small></label></form>`;
  showModal('ปิดรับออเดอร์ชั่วคราว', body, '<button class="btn btn-secondary" data-action="close-modal">ยกเลิก</button><button class="btn btn-danger" id="confirmCloseStore">ยืนยันปิดรับออเดอร์</button>');
  $('#confirmCloseStore').addEventListener('click', closeStoreNow);
}
async function closeStoreNow() {
  const form = $('#closeStoreForm'); if (!form.reportValidity()) return;
  const data = new FormData(form); const reason = String(data.get('reason') || '').trim();
  if (!reason) return toast('กรุณาระบุเหตุผลที่ปิดรับออเดอร์', 'error');
  const button = $('#confirmCloseStore'); button.disabled = true;
  try { await adminPost('setStoreStatus', { isOpen: false, reason, reopenAt: data.get('reopenAt') || '' }); closeModal(); await loadBootstrap(); renderSettings(); toast('ปิดรับออเดอร์แล้ว และแสดงเหตุผลให้ลูกค้าเห็น'); }
  catch (error) { toast(error.message, 'error'); button.disabled = false; }
}
async function openStoreNow() {
  confirmAction('เปิดรับออเดอร์อีกครั้ง?', 'ลูกค้าจะสามารถสั่งอาหารได้ทันที', async () => {
    setLoading(true, 'กำลังเปิดรับออเดอร์...');
    try { await adminPost('setStoreStatus', { isOpen: true }); await loadBootstrap(); renderSettings(); toast('เปิดรับออเดอร์แล้ว'); }
    catch (error) { toast(error.message, 'error'); }
    finally { setLoading(false); }
  });
}
async function saveOrderLimit(event) {
  event.preventDefault(); const form = event.currentTarget; const data = new FormData(form);
  try { await adminPost('saveOrderLimitSettings', { enabled: form.elements.enabled.checked, maxOrdersPerDay: Number(data.get('maxOrdersPerDay')) }); await loadBootstrap(); renderSettings(); toast('บันทึกการจำกัดออเดอร์แล้ว'); }
  catch (error) { toast(error.message, 'error'); }
}
async function uploadHomeAsset(event, kind) {
  const file = event.target.files?.[0];
  if (!file) return;
  const isBanner = kind === 'banner';
  const status = $(isBanner ? '#homeBannerUploadStatus' : '#brandLogoUploadStatus');
  const preview = $(isBanner ? '#homeBannerPreview' : '#brandLogoPreview');
  const hidden = $(isBanner ? '#homeBannerImageUrl' : '#brandLogoUrl');
  if (status) status.textContent = 'กำลังปรับขนาดและอัปโหลดรูป...';
  event.target.disabled = true;
  try {
    const image = await compressImage(file, kind === 'logo');
    if (preview) preview.src = image.preview;
    const result = await adminPost('uploadImage', { imageBase64: image.base64, fileName: image.fileName });
    if (!result.imageUrl) throw new Error('อัปโหลดแล้วแต่ไม่ได้รับ URL รูปภาพ');
    hidden.value = result.imageUrl;
    if (preview) preview.src = result.imageUrl;
    if (status) status.textContent = 'อัปโหลดสำเร็จ · พร้อมบันทึก';
    toast(isBanner ? 'อัปโหลดแบนเนอร์สำเร็จ' : 'อัปโหลดโลโก้สำเร็จ');
  } catch (error) {
    if (status) status.textContent = error.message;
    toast(error.message, 'error');
  } finally {
    event.target.disabled = false;
  }
}
async function saveHomeAppearance(event) {
  event.preventDefault();
  const form = event.currentTarget;
  const data = new FormData(form);
  const payload = {
    brandLogoUrl: String(data.get('brandLogoUrl') || ''),
    homeBannerImageUrl: String(data.get('homeBannerImageUrl') || ''),
    homeBannerEyebrow: String(data.get('homeBannerEyebrow') || '').trim(),
    homeBannerTitle: String(data.get('homeBannerTitle') || '').trim(),
    homeBannerSubtitle: String(data.get('homeBannerSubtitle') || '').trim(),
    homeBannerHeight: Number(data.get('homeBannerHeight') || 220)
  };
  try {
    await adminPost('saveStoreGeneralSettings', payload);
    await loadBootstrap();
    renderSettings();
    toast('บันทึกแบนเนอร์และโลโก้แล้ว');
  } catch (error) { toast(error.message, 'error'); }
}

async function saveGeneralSettings(event) {
  event.preventDefault(); const form = event.currentTarget; if (!form.reportValidity()) return;
  const data = new FormData(form);
  const payload = { restaurantName: String(data.get('restaurantName') || '').trim(), restaurantDescription: data.get('restaurantDescription') || '', orderAcceptMessage: data.get('orderAcceptMessage') || '', orderClosedMessage: data.get('orderClosedMessage') || '', deliveryFee: Number(data.get('deliveryFee') || 0), allowCashPayment: form.elements.allowCashPayment.checked, allowTransferPayment: form.elements.allowTransferPayment.checked, allowDineIn: form.elements.allowDineIn.checked, allowTakeaway: form.elements.allowTakeaway.checked, allowDelivery: form.elements.allowDelivery.checked };
  try { await adminPost('saveStoreGeneralSettings', payload); await loadBootstrap(); renderSettings(); toast('บันทึกข้อมูลร้านแล้ว'); }
  catch (error) { toast(error.message, 'error'); }
}
async function changePassword(event) {
  event.preventDefault(); const form = event.currentTarget; if (!form.reportValidity()) return;
  const data = new FormData(form); const password = String(data.get('newPassword') || '');
  if (password !== data.get('confirmPassword')) return toast('รหัสผ่านใหม่และยืนยันรหัสผ่านไม่ตรงกัน', 'error');
  try { await adminPost('changeAdminPassword', { newPassword: password }); toast('เปลี่ยนรหัสผ่านแล้ว กรุณาเข้าสู่ระบบใหม่'); logout(false); }
  catch (error) { toast(error.message, 'error'); }
}

/* =====================================================================
   11. GLOBAL EVENT DELEGATION AND SESSION RESTORE
   ===================================================================== */
async function handleAction(action, target) {
  const id = target.dataset.id || '';
  switch (action) {
    case 'close-modal': closeModal(); break;
    case 'modal-backdrop': if (target.classList.contains('modal-backdrop')) closeModal(); break;
    case 'go-orders': navigate('orders'); break;
    case 'go-settings': navigate('settings'); break;
    case 'go-loyalty': navigate('loyalty'); break;
    case 'go-options': navigate('options'); break;
    case 'go-customers': navigate('customers'); break;
    case 'add-menu': openMenuForm(); break;
    case 'edit-menu': openMenuForm(id); break;
    case 'toggle-menu': await toggleMenuAvailability(id, target.dataset.available === 'true'); break;
    case 'menu-filter': state.menuFilter = target.dataset.value || 'ALL'; renderMenu(); break;
    case 'manage-categories': openCategoryManager(); break;
    case 'edit-category': editCategory(id); break;
    case 'add-option-group': openOptionGroupForm(); break;
    case 'edit-option-group': openOptionGroupForm(id); break;
    case 'add-option': openOptionForm(target.dataset.group || ''); break;
    case 'edit-option': {
      const option = (state.bootstrap.options || []).find(row => String(row.optionId) === String(id));
      if (option) openOptionForm(option.groupId, option.optionId);
      break;
    }
    case 'refresh-customers': await loadCustomers(); break;
    case 'adjust-points': openAdjustPoints(id); break;
    case 'order-filter': state.orderFilter = target.dataset.value || 'ALL'; await loadOrders(true); break;
    case 'refresh-orders': await loadOrders(true); break;
    case 'order-detail': await showOrderDetail(id); break;
    case 'set-order-status':
    case 'detail-status': await changeOrderStatus(id, target.dataset.status || ''); break;
    case 'toggle-store': state.bootstrap.store?.isOpen ? openCloseStoreForm() : openStoreNow(); break;
    case 'close-store': openCloseStoreForm(); break;
    case 'open-store': openStoreNow(); break;
    case 'start-scanner': await startScanner(); break;
    case 'clear-brand-logo': { const input = $('#brandLogoUrl'); const preview = $('#brandLogoPreview'); const status = $('#brandLogoUploadStatus'); if (input) input.value = ''; if (preview) preview.src = placeholderImage(); if (status) status.textContent = 'จะใช้ตัวอักษร “เจ๊” แทนโลโก้'; break; }
    case 'stop-scanner': stopScanner(); $('#customerQrScanner').innerHTML = '<p class="muted">ปิดกล้องสแกนแล้ว</p>'; break;
    case 'redeem-manual-qr': await redeemManualQr(); break;
    default: break;
  }
}
document.addEventListener('click', async event => {
  const actionTarget = event.target.closest('[data-action]');
  if (actionTarget) {
    event.preventDefault();
    try { await handleAction(actionTarget.dataset.action, actionTarget); }
    catch (error) { toast(error.message || 'เกิดข้อผิดพลาด', 'error'); }
    return;
  }
  const nav = event.target.closest('.nav-button[data-page]');
  if (nav) { event.preventDefault(); navigate(nav.dataset.page); }
});
$('#loginForm').addEventListener('submit', event => { event.preventDefault(); login($('#loginPassword').value); });
$('#logoutButton').addEventListener('click', () => confirmAction('ออกจากระบบ?', 'คุณต้องการออกจากระบบจัดการร้านใช่หรือไม่', async () => logout(true)));
$('#refreshButton').addEventListener('click', refreshCurrentPage);
$('#mobileMenuButton').addEventListener('click', () => { $('#sidebar').classList.toggle('open'); $('#sidebarOverlay').classList.toggle('show'); });
$('#sidebarOverlay').addEventListener('click', () => { $('#sidebar').classList.remove('open'); $('#sidebarOverlay').classList.remove('show'); });
document.addEventListener('keydown', event => { if (event.key === 'Escape' && !$('#modalRoot').hidden) closeModal(); });
window.addEventListener('online', () => toast('เชื่อมต่ออินเทอร์เน็ตแล้ว'));
window.addEventListener('offline', () => toast('ขณะนี้อุปกรณ์ออฟไลน์ กรุณาตรวจสอบอินเทอร์เน็ต', 'error'));

(async function initializeDashboard() {
  const savedToken = sessionStorage.getItem(CONFIG.SESSION_KEY);
  if (!savedToken) { $('#loginPassword').focus(); return; }
  state.token = savedToken;
  try { await enterApp(); }
  catch (error) {
    logout(false);
    toast('Session เดิมใช้ไม่ได้แล้ว กรุณาเข้าสู่ระบบใหม่', 'error');
  }
})();
</script>
