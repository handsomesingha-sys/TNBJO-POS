  <style>

<body>
  <section id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="brand-mark">🍜</div>
      <h1 class="login-title">ก๋วยเตี๋ยวโบราณ by เจ๊อ้น</h1>
      <p class="login-sub">ระบบจัดการร้านอาหาร</p>
      <form id="loginForm">
        <div class="field">
          <label for="adminPassword">รหัสเข้าใช้งาน</label>
          <input id="adminPassword" type="password" autocomplete="current-password" placeholder="กรอกรหัสเข้าใช้งาน" required autofocus>
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="loginButton">เข้าสู่ระบบ</button>
        <div id="loginError" class="login-error" aria-live="polite"></div>
      </form>
      <div class="login-foot">เฉพาะเจ้าของร้านและผู้ได้รับอนุญาต</div>
    </div>
  </section>

  <div id="appShell" class="app-shell hidden">
    <aside id="sidebar" class="sidebar">
      <div class="side-brand"><div class="side-logo">🍜</div><div><strong>ก๋วยเตี๋ยวโบราณ<br>by เจ๊อ้น</strong><small>RESTAURANT CONTROL</small></div></div>
      <div class="nav-label">เมนูหลัก</div>
      <nav class="side-nav" id="sideNav">
        <button class="nav-btn active" data-page="overview"><span class="nav-ico">▦</span>ภาพรวมร้าน</button>
        <button class="nav-btn" data-page="orders"><span class="nav-ico">▤</span>จัดการคำสั่งซื้อ</button>
        <button class="nav-btn" data-page="menu"><span class="nav-ico">🍜</span>เมนูอาหาร</button>
        <button class="nav-btn" data-page="options"><span class="nav-ico">☷</span>ตัวเลือกอาหาร</button>
        <button class="nav-btn" data-page="customers"><span class="nav-ico">♙</span>สมาชิก</button>
        <button class="nav-btn" data-page="points"><span class="nav-ico">✧</span>แต้มและของรางวัล</button>
        <button class="nav-btn" data-page="settings"><span class="nav-ico">⚙</span>ตั้งค่าร้านค้า</button>
        <button class="nav-btn" data-page="staff"><span class="nav-ico">♧</span>ผู้ดูแล LINE</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="admin-meta"><div class="admin-avatar">JA</div><div><b>เจ้าของร้าน</b><small>OWNER ACCESS</small></div></div>
        <button class="btn btn-ghost btn-block" id="logoutButton">ออกจากระบบ</button>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <button class="btn btn-ghost btn-icon mobile-menu" id="mobileMenuButton" aria-label="เปิดเมนู">☰</button>
          <div><h1 id="topTitle">ภาพรวมร้าน</h1><p id="topSubtitle">ภาพรวมยอดขายและคำสั่งซื้อของวันนี้</p></div>
        </div>
        <div class="top-actions">
          <div class="sound-control"><span id="soundLabel">เสียงแจ้งเตือน</span><button class="toggle" id="soundToggle" aria-label="เปิดปิดเสียง"></button></div>
          <button class="btn btn-ghost btn-sm" id="testSoundButton" title="ทดลองเสียง">♫ <span class="btn-label">ทดลองเสียง</span></button>
          <div class="store-chip"><span class="status-dot"></span>ระบบออนไลน์</div>
          <button class="btn btn-ghost btn-icon" id="refreshButton" title="รีเฟรชข้อมูล">↻</button>
        </div>
      </header>
      <div id="pageContent" class="page-wrap"><div class="empty-state"><span class="spinner"></span><b>กำลังโหลดข้อมูล</b></div></div>
    </main>
  </div>

  <nav class="mobile-bottom hidden" id="mobileBottomNav">
    <button data-page="overview" class="active"><span>▦</span>ภาพรวม</button>
    <button data-page="orders"><span>▤</span>ออเดอร์</button>
    <button data-page="menu"><span>🍜</span>เมนู</button>
    <button data-page="points"><span>✧</span>แต้ม</button>
    <button data-page="settings"><span>⚙</span>ตั้งค่า</button>
  </nav>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-wrap" aria-live="polite"></div>

  <script>
    'use strict';

    /* =====================================================================
       1. CONFIGURATION
       ===================================================================== */
    const CONFIG = Object.freeze({
      API_URL: 'https://script.google.com/macros/s/AKfycby4WFh_zT-NdWx4dhcXKGNc-KIVyoyKK1IXJnpSkAz-Hn4J1Chuw3tYvtkEZUwcO6fo/exec',
      API_TIMEOUT_MS: 25000,
      ORDER_POLL_MS: 5000,
      SUMMARY_POLL_MS: 20000,
      SESSION_KEY: 'jaeon_admin_session_v1',
      SOUND_KEY: 'jaeon_admin_sound_enabled'
    });

    const STATUS = {

      READY: 'อาหารพร้อมแล้ว', COMPLETED: 'เสร็จสิ้น', CANCELLED: 'ยกเลิกแล้ว'
    };
    const PAGE_META = {
      overview: ['ภาพรวมร้าน', 'ภาพรวมยอดขายและคำสั่งซื้อของวันนี้'],
      orders: ['จัดการคำสั่งซื้อ', 'ตรวจสอบ รับออเดอร์ และติดตามสถานะการทำอาหาร'],
      menu: ['เมนูอาหาร', 'จัดการรายการอาหาร หมวดหมู่ ราคา และรูปภาพ'],
      options: ['ตัวเลือกอาหาร', 'ตั้งค่ากลุ่มตัวเลือกและผูกเข้ากับเมนู'],
      customers: ['สมาชิก', 'ค้นหาสมาชิกและดูประวัติแต้ม'],
      points: ['แต้มและของรางวัล', 'ตั้งค่าแต้ม สร้าง QR และจัดการการแลกรางวัล'],
      settings: ['ตั้งค่าร้านค้า', 'ข้อมูลร้าน เวลาเปิดปิด และการรับชำระเงิน'],
      staff: ['ผู้ดูแล LINE', 'จัดการ LINE User ID ที่ได้รับอนุญาตให้กดปุ่มในกลุ่ม']
    };

    const state = {
      sessionToken: '', page: 'overview', dashboard: null, orders: [], catalog: null,
      settings: {}, pointSettings: {}, customers: [], pointTransactions: [], redemptions: [],
      rewards: [], lineAdmins: [], orderQuery: '', orderStatus: '', orderDate: '',
      customerQuery: '', selectedCategory: 'all', orderPollTimer: null, summaryTimer: null,
      knownOrderIds: new Set(), pollingReady: false, audioContext: null, audioUnlocked: false,
      soundEnabled: localStorage.getItem(CONFIG.SOUND_KEY) !== 'false',
      storeQr: null, storeQrPollTimer: null, storeQrTimer: null, qrScanner: null,
      orderModalBusy: false
    };

    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));

    document.addEventListener('DOMContentLoaded', initialize);

    /* =====================================================================
       2. INITIALIZATION AND AUTHENTICATION
       ===================================================================== */
    async function initialize() {
      $('#loginForm').addEventListener('submit', handleLogin);
      $('#logoutButton').addEventListener('click', logout);
      $('#mobileMenuButton').addEventListener('click', () => $('#sidebar').classList.toggle('open'));
      $('#refreshButton').addEventListener('click', () => refreshCurrentPage(true));
      $('#soundToggle').addEventListener('click', toggleSound);
      $('#testSoundButton').addEventListener('click', async () => { await unlockAudio(); playOrderSound(); toast('ทดลองเสียงแจ้งเตือนแล้ว'); });
      document.addEventListener('click', handleClick);
      document.addEventListener('submit', handleSubmit);
      document.addEventListener('change', handleChange);
      document.addEventListener('input', handleInput);
      $('#soundToggle').classList.toggle('on', state.soundEnabled);

      if (!isApiConfigured()) {
        $('#loginError').textContent = 'กรุณาตั้งค่า API_URL ในส่วน FRONTEND CONFIGURATION ก่อนใช้งาน';
        return;
      }

      const saved = sessionStorage.getItem(CONFIG.SESSION_KEY);
      if (saved) {
        try {
          state.sessionToken = saved;
          await adminApi('admin.getDashboard');
          await enterDashboard();
          return;
        } catch (error) {
          clearSession();
          $('#loginError').textContent = error.message || 'Session หมดอายุ กรุณาเข้าสู่ระบบใหม่';
        }
      }
      $('#loginScreen').classList.remove('hidden');
    }

    function isApiConfigured() {
      return /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(CONFIG.API_URL);
    }

    async function handleLogin(event) {
      event.preventDefault();
      const password = $('#adminPassword').value;
      const button = $('#loginButton');
      const errorBox = $('#loginError');
      errorBox.textContent = '';
      if (!password) { errorBox.textContent = 'กรุณากรอกรหัสเข้าใช้งาน'; return; }
      button.disabled = true;
      button.innerHTML = '<span class="spinner"></span> กำลังตรวจสอบ...';
      await unlockAudio();
      try {
        const result = await api('admin.login', { password });
        if (!result || !result.sessionToken) throw new Error('ระบบไม่ส่ง Session กลับมา กรุณาลองใหม่');
        state.sessionToken = result.sessionToken;
        sessionStorage.setItem(CONFIG.SESSION_KEY, result.sessionToken);
        $('#adminPassword').value = '';
        await enterDashboard();
      } catch (error) {
        errorBox.textContent = error.message || 'เข้าสู่ระบบไม่สำเร็จ';
      } finally {
        button.disabled = false;
        button.textContent = 'เข้าสู่ระบบ';
      }
    }

    async function enterDashboard() {
      $('#loginScreen').classList.add('hidden');
      $('#appShell').classList.remove('hidden');
      $('#mobileBottomNav').classList.remove('hidden');
      $('#sidebar').classList.remove('open');
      try {
        await loadInitialData();
        render();
        startPolling();
      } catch (error) {
        if (isAuthError(error)) { clearSession(); $('#appShell').classList.add('hidden'); $('#mobileBottomNav').classList.add('hidden'); $('#loginScreen').classList.remove('hidden'); }
        toast(error.message || 'โหลดข้อมูลไม่สำเร็จ', 'error');
      }
    }

    function clearSession() {
      state.sessionToken = '';
      sessionStorage.removeItem(CONFIG.SESSION_KEY);
      stopPolling();
    }

    async function logout() {
      stopPolling();
      try { if (state.sessionToken) await adminApi('admin.logout'); } catch (_) { /* Session may already be expired. */ }
      clearSession();
      $('#appShell').classList.add('hidden');
      $('#mobileBottomNav').classList.add('hidden');
      $('#loginScreen').classList.remove('hidden');
      $('#loginError').textContent = '';
      $('#adminPassword').value = '';
      toast('ออกจากระบบแล้ว');
    }

    /* =====================================================================
       3. GOOGLE APPS SCRIPT API TRANSPORT
       Same hidden-iframe / postMessage contract as index.html.
       ===================================================================== */
    function api(action, data = {}) {
      return new Promise((resolve, reject) => {
        const requestId = createRequestId();
        const frameName = 'jaeon_admin_api_' + requestId;
        const frame = document.createElement('iframe');
        frame.name = frameName;
        frame.title = 'API request';
        frame.setAttribute('aria-hidden', 'true');
        frame.style.cssText = 'position:absolute;width:0;height:0;border:0;visibility:hidden;';

        const form = document.createElement('form');
        form.method = 'POST';
        form.action = CONFIG.API_URL;
        form.target = frameName;
        form.style.display = 'none';

        const payloadInput = document.createElement('input');
        payloadInput.type = 'hidden';
        payloadInput.name = 'payload';
        payloadInput.value = JSON.stringify({ requestId, action, data: data || {} });
        form.appendChild(payloadInput);

        let settled = false;
        const cleanup = () => {
          window.removeEventListener('message', onMessage);
          window.clearTimeout(timeoutId);
          form.remove(); frame.remove();
        };
        const finish = (fn, value) => { if (settled) return; settled = true; cleanup(); fn(value); };
        const onMessage = event => {
          if (event.source !== frame.contentWindow) return;
          const message = event.data;
          if (!message || message.channel !== 'JAEON_GAS_API' || message.requestId !== requestId) return;
          const result = message.result;
          if (result && result.ok) finish(resolve, result.data);
          else {
            const error = new Error(result && result.error ? result.error.message : 'API ทำงานไม่สำเร็จ');
            error.code = result && result.error ? result.error.code : 'API_ERROR';
            finish(reject, error);
          }
        };
        const timeoutId = window.setTimeout(() => {
          const error = new Error('เชื่อมต่อ Google Apps Script ไม่สำเร็จ กรุณาตรวจสอบ URL, Deployment และ FRONTEND_ORIGIN');
          error.code = 'API_TIMEOUT'; finish(reject, error);
        }, CONFIG.API_TIMEOUT_MS);

        window.addEventListener('message', onMessage);
        document.body.append(frame, form);
        try { form.submit(); } catch (error) { finish(reject, error); }
      });
    }

    function adminApi(action, data = {}) {
      return api(action, Object.assign({}, data, { sessionToken: state.sessionToken }));
    }

    function isAuthError(error) {
      return ['UNAUTHORIZED', 'SESSION_EXPIRED'].includes(error && error.code);
    }

    async function apiGuard(action, data = {}) {
      try { return await adminApi(action, data); }
      catch (error) {
        if (isAuthError(error)) {
          clearSession(); $('#appShell').classList.add('hidden'); $('#mobileBottomNav').classList.add('hidden');
          $('#loginScreen').classList.remove('hidden');
          $('#loginError').textContent = 'Session หมดอายุ กรุณาเข้าสู่ระบบใหม่';
        }
        throw error;
      }
    }

    function createRequestId() {
      const bytes = new Uint8Array(18);
      crypto.getRandomValues(bytes);
      return Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
    }

    /* =====================================================================
       4. DATA LOADING AND POLLING
       ===================================================================== */
    async function loadInitialData() {
      const [dashboard, catalog, settings, pointSettings, orders] = await Promise.all([
        apiGuard('admin.getDashboard'), apiGuard('admin.getCatalog'),
        apiGuard('admin.getStoreSettings'), apiGuard('admin.getPointSettings'),
        apiGuard('admin.listOrders', { limit: 100 })
      ]);
      state.dashboard = dashboard || {};
      state.catalog = catalog || { categories: [], products: [], optionGroups: [], options: [], productOptions: [] };
      state.settings = settings || {};
      state.pointSettings = pointSettings || {};
      state.orders = Array.isArray(orders) ? orders : [];
      state.knownOrderIds = new Set(state.orders.map(order => String(order.orderId)));
      state.pollingReady = true;
    }

    async function refreshCurrentPage(showMessage = false) {
      try {
        if (state.page === 'overview') await refreshOverview();
        else if (state.page === 'orders') await loadOrders();
        else if (state.page === 'menu' || state.page === 'options') await loadCatalog();
        else if (state.page === 'customers') await loadCustomers();
        else if (state.page === 'points') await loadPointsData();
        else if (state.page === 'settings') await loadSettings();
        else if (state.page === 'staff') await loadLineAdmins();
        render();
        if (showMessage) toast('อัปเดตข้อมูลแล้ว');
      } catch (error) { toast(error.message || 'อัปเดตข้อมูลไม่สำเร็จ', 'error'); }
    }

    async function refreshOverview() {
      const [dashboard, orders] = await Promise.all([
        apiGuard('admin.getDashboard'), apiGuard('admin.listOrders', { limit: 100 })
      ]);
      state.dashboard = dashboard || {};
      state.orders = Array.isArray(orders) ? orders : [];
    }

    async function loadOrders() {
      const filters = { limit: 200 };
      if (state.orderStatus) filters.status = state.orderStatus;
      if (state.orderQuery) filters.query = state.orderQuery;
      if (state.orderDate) filters.date = state.orderDate;
      state.orders = await apiGuard('admin.listOrders', filters) || [];
    }

    async function loadCatalog() {
      state.catalog = await apiGuard('admin.getCatalog') || state.catalog;
    }

    async function loadCustomers() {
      state.customers = await apiGuard('admin.getCustomers', { query: state.customerQuery, limit: 300 }) || [];
    }

    async function loadPointsData() {
      const results = await Promise.all([
        apiGuard('admin.getPointSettings'), apiGuard('admin.listPointTransactions', { limit: 200 }),
        apiGuard('admin.listRedemptions', { limit: 200 }), api('customer.getRewards', {}),
        apiGuard('admin.getCustomers', { limit: 300 })
      ]);
      state.pointSettings = results[0] || {};
      state.pointTransactions = results[1] || [];
      state.redemptions = results[2] || [];
      state.rewards = results[3] || [];
      state.customers = results[4] || state.customers;
    }

    async function loadSettings() {
      state.settings = await apiGuard('admin.getStoreSettings') || {};
    }

    async function loadLineAdmins() {
      state.lineAdmins = await apiGuard('admin.listLineAdmins') || [];
    }

    function startPolling() {
      stopPolling();
      state.orderPollTimer = window.setInterval(pollNewOrders, CONFIG.ORDER_POLL_MS);
      state.summaryTimer = window.setInterval(async () => {
        try {
          const summary = await apiGuard('admin.getDashboard');
          state.dashboard = summary || state.dashboard;
          if (state.page === 'overview') render();
        } catch (error) { console.warn('Dashboard summary polling:', error); }
      }, CONFIG.SUMMARY_POLL_MS);
    }

    function stopPolling() {
      if (state.orderPollTimer) clearInterval(state.orderPollTimer);
      if (state.summaryTimer) clearInterval(state.summaryTimer);
      state.orderPollTimer = null; state.summaryTimer = null;
    }

    async function pollNewOrders() {
      if (!state.sessionToken || document.hidden) return;
      try {
        const latest = await apiGuard('admin.listOrders', { limit: 100 });
        const current = Array.isArray(latest) ? latest : [];
        const fresh = current.filter(order => !state.knownOrderIds.has(String(order.orderId)));
        current.forEach(order => state.knownOrderIds.add(String(order.orderId)));
        if (state.knownOrderIds.size > 600) state.knownOrderIds = new Set(current.map(order => String(order.orderId)));
        state.orders = current;
        if (fresh.length) {
          fresh.forEach(order => {
            playOrderSound();
            toast('มีคำสั่งซื้อใหม่ ' + order.orderId, 'success', 'ยอด ' + money(order.total) + ' · ' + (order.customerName || 'ลูกค้า'));
          });
          if (state.page === 'overview' || state.page === 'orders') render();
          const [summary] = await Promise.all([apiGuard('admin.getDashboard')]);
          state.dashboard = summary || state.dashboard;
          if (state.page === 'overview') render();
        }
      } catch (error) { console.warn('Order polling:', error); }
    }

    /* =====================================================================
       5. NAVIGATION AND GLOBAL INTERACTIONS
       ===================================================================== */
    async function navigate(page) {
      if (!PAGE_META[page]) return;
      state.page = page;
      $('#sidebar').classList.remove('open');
      $$('.nav-btn').forEach(button => button.classList.toggle('active', button.dataset.page === page));
      $$('#mobileBottomNav button').forEach(button => button.classList.toggle('active', button.dataset.page === page));
      $('#topTitle').textContent = PAGE_META[page][0];
      $('#topSubtitle').textContent = PAGE_META[page][1];
      try {
        if (page === 'overview') await refreshOverview();
        if (page === 'orders') await loadOrders();
        if (page === 'menu' || page === 'options') await loadCatalog();
        if (page === 'customers') await loadCustomers();
        if (page === 'points') await loadPointsData();
        if (page === 'settings') await loadSettings();
        if (page === 'staff') await loadLineAdmins();
      } catch (error) { toast(error.message || 'โหลดข้อมูลไม่สำเร็จ', 'error'); }
      render();
    }

    function handleClick(event) {
      const nav = event.target.closest('[data-page]');
      if (nav) { navigate(nav.dataset.page); return; }
      const action = event.target.closest('[data-action]');
      if (!action) {
        if (event.target.classList.contains('modal-backdrop')) closeModal();
        return;
      }
      const name = action.dataset.action;
      const id = action.dataset.id;
      if (name === 'close-modal') closeModal();
      else if (name === 'new-category') openCategoryModal();
      else if (name === 'edit-category') openCategoryModal(id);
      else if (name === 'new-product') openProductModal();
      else if (name === 'edit-product') openProductModal(id);
      else if (name === 'toggle-product') toggleProduct(id, action.dataset.available === 'true');
      else if (name === 'new-group') openGroupModal();
      else if (name === 'edit-group') openGroupModal(id);
      else if (name === 'new-option') openOptionModal(action.dataset.groupId);
      else if (name === 'link-group') openLinkGroupModal(id);
      else if (name === 'order-detail') openOrderDetail(id);
      else if (name === 'order-status') changeOrderStatus(id, action.dataset.status);
      else if (name === 'payment-status') changePaymentStatus(id, action.dataset.status);
      else if (name === 'customer-detail') openCustomerDetail(id);
      else if (name === 'adjust-points') openAdjustPointsModal(id);
      else if (name === 'new-reward') openRewardModal();
      else if (name === 'edit-reward') openRewardModal(id);
      else if (name === 'create-store-qr') createStoreQr();
      else if (name === 'open-customer-scanner') openCustomerScanner();
      else if (name === 'start-camera') startCameraScan();
      else if (name === 'submit-manual-qr') submitManualQr();
      else if (name === 'redemption-status') changeRedemptionStatus(id, action.dataset.status);
      else if (name === 'export-orders') exportOrdersCsv();
      else if (name === 'save-point-settings') savePointSettings();
      else if (name === 'add-line-admin') openLineAdminModal();
      else if (name === 'refresh-orders') refreshCurrentPage(true);
      else if (name === 'switch-menu-tab') { state.menuTab = action.dataset.tab; render(); }
    }

    function handleInput(event) {
      if (event.target.id === 'orderSearch') {
        state.orderQuery = event.target.value.trim();
        debounceLoad('orders');
      } else if (event.target.id === 'customerSearch') {
        state.customerQuery = event.target.value.trim();
        debounceLoad('customers');
      }
    }

    let searchDebounce = null;
    function debounceLoad(page) {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(async () => {
        try { if (page === 'orders') await loadOrders(); else await loadCustomers(); render(); }
        catch (error) { toast(error.message, 'error'); }
      }, 300);
    }

    function handleChange(event) {
      const target = event.target;
      if (target.id === 'orderStatusFilter') { state.orderStatus = target.value; loadOrders().then(render).catch(err => toast(err.message, 'error')); }
      if (target.id === 'orderDateFilter') { state.orderDate = target.value; loadOrders().then(render).catch(err => toast(err.message, 'error')); }
      if (target.id === 'productImageFile') uploadSelectedImage(target.files && target.files[0]);
      if (target.id === 'categoryFilter') { state.selectedCategory = target.value; render(); }
    }

    async function handleSubmit(event) {
      const form = event.target.closest('form[data-form]');
      if (!form) return;
      event.preventDefault();
      const data = formDataObject(form);
      const type = form.dataset.form;
      try {
        if (type === 'category') await saveCategory(data);
        else if (type === 'product') await saveProduct(data);
        else if (type === 'group') await saveOptionGroup(data);
        else if (type === 'option') await saveOption(data);
        else if (type === 'settings') await saveStoreSettings(data);
        else if (type === 'reward') await saveReward(data);
        else if (type === 'line-admin') await saveLineAdmin(data);
        else if (type === 'cancel-order') await saveOrderStatus(data.orderId, 'CANCELLED', data.reason);
        else if (type === 'adjust-points') await adjustPoints(data);
        closeModal();
      } catch (error) { toast(error.message || 'บันทึกข้อมูลไม่สำเร็จ', 'error'); }
    }

    function formDataObject(form) {
      const formData = new FormData(form);
      const result = {};
      for (const [key, value] of formData.entries()) {
        if (value instanceof File) continue;
        result[key] = value;
      }
      $$('input[type="checkbox"][name]', form).forEach(input => { result[input.name] = input.checked; });
      return result;
    }

    /* =====================================================================
       6. PAGE RENDERERS
       ===================================================================== */
    function render() {
      const content = $('#pageContent');
      if (!content) return;
      const activeElement = document.activeElement;
      const activeId = activeElement && activeElement.id;
      const selectionStart = activeElement && typeof activeElement.selectionStart === 'number' ? activeElement.selectionStart : null;
      const renderers = {
        overview: renderOverview, orders: renderOrders, menu: renderMenu,
        options: renderOptions, customers: renderCustomers, points: renderPoints,
        settings: renderSettings, staff: renderStaff
      };
      content.innerHTML = (renderers[state.page] || renderOverview)();
      $('#soundToggle').classList.toggle('on', state.soundEnabled);
      $('#soundLabel').textContent = state.soundEnabled ? 'เปิดเสียง' : 'ปิดเสียง';
      $$('.nav-btn').forEach(button => button.classList.toggle('active', button.dataset.page === state.page));
      $$('#mobileBottomNav button').forEach(button => button.classList.toggle('active', button.dataset.page === state.page));
      if (activeId) { const restored = document.getElementById(activeId); if (restored) { restored.focus(); if (selectionStart !== null && typeof restored.setSelectionRange === 'function') restored.setSelectionRange(selectionStart, selectionStart); } }
    }

    function renderOverview() {
      const stats = state.dashboard && state.dashboard.stats || {};
      const chart = state.dashboard && state.dashboard.last7Days || [];
      const maxRevenue = Math.max(1, ...chart.map(day => number(day.revenue)));
      const recent = state.dashboard && state.dashboard.recentOrders || [];
      const activeOrders = state.orders.filter(order => !['COMPLETED', 'CANCELLED'].includes(order.status)).slice(0, 6);
      return `
        <div class="page-head"><div><h2>สวัสดี, เจ๊อ้น 👋</h2><p>นี่คือภาพรวมการดำเนินงานของร้านในวันนี้</p></div><div class="page-actions"><button class="btn btn-soft" data-action="refresh-orders">↻ อัปเดตข้อมูล</button><button class="btn btn-primary" data-page="orders">ดูออเดอร์ทั้งหมด →</button></div></div>
        <section class="stats-grid">
          ${statCard('ยอดขายวันนี้', money(stats.todayRevenue), '฿', 'ยอดรวมออเดอร์ที่ไม่ถูกยกเลิก')}
          ${statCard('ออเดอร์วันนี้', number(stats.todayOrders), '▤', 'จำนวนรายการสั่งซื้อทั้งหมด')}
          ${statCard('ออเดอร์ใหม่', number(stats.newOrders), '✦', 'รอร้านรับคำสั่งซื้อ')}
          ${statCard('กำลังปรุง', number(stats.preparingOrders), '♨', 'รายการที่อยู่ระหว่างทำอาหาร')}
        </section>
        <div class="dashboard-grid">
          <section class="panel"><div class="panel-head"><div><h3>ยอดขาย 7 วันล่าสุด</h3><small>สรุปตามวันที่สร้างคำสั่งซื้อ</small></div><span class="pill pill-neutral">7 DAYS</span></div>
            <div class="chart-bars">${chart.map(day => `<div class="chart-col"><em>${compactMoney(day.revenue)}</em><div class="chart-bar" style="height:${Math.max(3, number(day.revenue) / maxRevenue * 125)}px"></div><small>${thaiDateShort(day.date)}</small></div>`).join('') || '<div class="empty-state">ยังไม่มีข้อมูลยอดขาย</div>'}</div>
          </section>
          <section class="panel"><div class="panel-head"><div><h3>ออเดอร์ล่าสุด</h3><small>รายการที่เพิ่งเข้ามา</small></div><button class="btn btn-ghost btn-sm" data-page="orders">ดูทั้งหมด</button></div>
            <div class="order-mini-list">${recent.length ? recent.slice(0, 6).map(order => `<div class="order-mini"><div><b>${esc(order.orderId)}</b><small>${esc(order.customerName || 'สมาชิก LINE')} · ${thaiDateTime(order.createdAt)}</small><span class="pill ${statusClass(order.status)}">${esc(STATUS[order.status] || order.status)}</span></div><div class="amount">${money(order.total)}</div></div>`).join('') : empty('ยังไม่มีคำสั่งซื้อ', 'รายการใหม่จะแสดงที่นี่')}</div>
          </section>
        </div>
        <section class="panel" style="margin-top:16px"><div class="panel-head"><div><h3>ออเดอร์ที่กำลังดำเนินการ</h3><small>ตรวจสอบและอัปเดตสถานะได้จากหน้านี้</small></div><span class="pill pill-new">${activeOrders.length} รายการ</span></div>
          ${activeOrders.length ? `<div class="table-wrap"><table><thead><tr><th>เลขออเดอร์</th><th>ลูกค้า</th><th>เวลาสั่ง</th><th>ประเภท</th><th>ยอดรวม</th><th>สถานะ</th><th></th></tr></thead><tbody>${activeOrders.map(orderRow).join('')}</tbody></table></div>` : empty('ไม่มีออเดอร์ค้าง', 'เมื่อมีลูกค้าสั่งอาหาร รายการจะแสดงที่นี่')}
        </section>`;
    }

    function statCard(title, value, icon, foot) {
      return `<div class="stat-card"><div class="stat-top"><span>${title}</span><span class="stat-icon">${icon}</span></div><div class="stat-value">${value}</div><div class="stat-foot">${foot}</div></div>`;
    }

    function renderOrders() {
      let rows = state.orders || [];
      if (state.orderStatus) rows = rows.filter(order => order.status === state.orderStatus);
      if (state.orderDate) rows = rows.filter(order => { const d = new Date(order.createdAt); return !Number.isNaN(d.getTime()) && d.toLocaleDateString('en-CA', { timeZone: 'Asia/Bangkok' }) === state.orderDate; });
      if (state.orderQuery) { const q = state.orderQuery.toLowerCase(); rows = rows.filter(order => [order.orderId, order.customerName, order.customerLineUserId].some(value => String(value || '').toLowerCase().includes(q))); }
      return `<div class="page-head"><div><h2>คำสั่งซื้อ</h2><p>รายการสั่งอาหารจากลูกค้า LINE MINI APP</p></div><div class="page-actions"><button class="btn btn-ghost" data-action="export-orders">↓ ส่งออก CSV</button><button class="btn btn-primary" data-action="refresh-orders">↻ รีเฟรชรายการ</button></div></div>
        <div class="toolbar"><input id="orderSearch" placeholder="ค้นหาเลขออเดอร์ / ชื่อลูกค้า / LINE ID" value="${attr(state.orderQuery)}"><select id="orderStatusFilter"><option value="">ทุกสถานะ</option>${Object.keys(STATUS).map(key => `<option value="${key}" ${state.orderStatus === key ? 'selected' : ''}>${STATUS[key]}</option>`).join('')}</select><input type="date" id="orderDateFilter" value="${attr(state.orderDate)}" title="กรองวันที่"><button class="btn btn-ghost btn-sm" data-action="refresh-orders">ล้าง/โหลดใหม่</button></div>
        <section class="content-card">${rows.length ? `<div class="table-wrap"><table><thead><tr><th>เลขออเดอร์</th><th>ลูกค้า</th><th>เวลาสั่ง</th><th>ประเภทรับอาหาร</th><th>ชำระเงิน</th><th>ยอดรวม</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody>${rows.map(orderRow).join('')}</tbody></table></div>` : empty('ไม่พบคำสั่งซื้อ', 'ลองเปลี่ยนตัวกรองหรือรอรายการใหม่')}</section>`;
    }

    function orderRow(order) {
      return `<tr><td><b>${esc(order.orderId)}</b></td><td>${esc(order.customerName || 'สมาชิก LINE')}<small>${esc(shortLineId(order.customerLineUserId))}</small></td><td>${thaiDateTime(order.createdAt)}</td><td>${orderTypeLabel(order.orderType)}</td><td>${paymentLabel(order.paymentMethod)}<small>${paymentStatusLabel(order.paymentStatus)}</small></td><td><b>${money(order.total)}</b></td><td><span class="pill ${statusClass(order.status)}">${esc(STATUS[order.status] || order.status)}</span></td><td><button class="btn btn-ghost btn-sm" data-action="order-detail" data-id="${attr(order.orderId)}">รายละเอียด</button></td></tr>`;
    }

    function renderMenu() {
      const catalog = state.catalog || { categories: [], products: [] };
      const cats = catalog.categories || [];
      const products = (catalog.products || []).filter(product => state.selectedCategory === 'all' || String(product.categoryId) === String(state.selectedCategory));
      const activeTab = state.menuTab || 'products';
      return `<div class="page-head"><div><h2>จัดการเมนูอาหาร</h2><p>เพิ่ม แก้ไข ราคา รูปภาพ และเปิดปิดการขาย</p></div><div class="page-actions"><button class="btn btn-ghost" data-action="new-category">＋ หมวดหมู่</button><button class="btn btn-primary" data-action="new-product">＋ เพิ่มเมนูอาหาร</button></div></div>
        <div class="cat-row"><button class="cat-chip ${state.selectedCategory === 'all' ? 'active' : ''}" data-action="switch-category" data-id="all">ทั้งหมด</button>${cats.map(cat => `<button class="cat-chip ${state.selectedCategory === cat.categoryId ? 'active' : ''}" data-action="switch-category" data-id="${attr(cat.categoryId)}">${esc(cat.name)}</button>`).join('')}</div>
        <div class="toolbar"><select id="categoryFilter"><option value="all">ทุกหมวดหมู่</option>${cats.map(cat => `<option value="${attr(cat.categoryId)}" ${state.selectedCategory === cat.categoryId ? 'selected' : ''}>${esc(cat.name)}</option>`).join('')}</select><span class="helper">${products.length} เมนู</span></div>
        ${products.length ? `<div class="cards-grid">${products.map(product => `<article class="product-card"><div class="product-image">${product.imageUrl ? `<img src="${attr(product.imageUrl)}" alt="${attr(product.name)}" loading="lazy" onerror="this.remove()">` : '<span>🍜</span>'}</div><div class="product-info"><h4>${esc(product.name)}</h4><p>${esc(product.description || 'ไม่มีคำอธิบาย')}</p><div class="product-bottom"><span class="product-price">${money(product.price)}</span><span class="pill ${bool(product.isAvailable) ? 'pill-ready' : 'pill-cancelled'}">${bool(product.isAvailable) ? 'เปิดขาย' : 'ปิดขาย'}</span></div><div class="divider"></div><div class="table-actions"><button class="btn btn-ghost btn-sm" data-action="edit-product" data-id="${attr(product.productId)}">แก้ไข</button><button class="btn ${bool(product.isAvailable) ? 'btn-warning' : 'btn-soft'} btn-sm" data-action="toggle-product" data-id="${attr(product.productId)}" data-available="${bool(product.isAvailable)}">${bool(product.isAvailable) ? 'ปิดขาย' : 'เปิดขาย'}</button></div></div></article>`).join('')}</div>` : empty('ยังไม่มีเมนูในหมวดนี้', 'กดเพิ่มเมนูอาหารเพื่อเริ่มต้น')}
        <section class="panel" style="margin-top:17px"><div class="panel-head"><h3>จัดการหมวดหมู่</h3><small>กดแก้ไขเพื่อเปลี่ยนชื่อและลำดับ</small></div>${cats.length ? cats.map(cat => `<div class="order-mini"><div><b>${esc(cat.name)}</b><small>ลำดับ ${number(cat.sortOrder)} · ${bool(cat.isActive) ? 'เปิดใช้งาน' : 'ปิดใช้งาน'}</small></div><button class="btn btn-ghost btn-sm" data-action="edit-category" data-id="${attr(cat.categoryId)}">แก้ไข</button></div>`).join('') : empty('ยังไม่มีหมวดหมู่', 'เพิ่มหมวดหมู่ก่อนสร้างเมนู')}</section>`;
    }

    function renderOptions() {
      const groups = state.catalog && state.catalog.optionGroups || [];
      const options = state.catalog && state.catalog.options || [];
      const links = state.catalog && state.catalog.productOptions || [];
      const products = state.catalog && state.catalog.products || [];
      return `<div class="page-head"><div><h2>ตัวเลือกอาหาร</h2><p>จัดการกลุ่มเลือกเส้น น้ำซุป ความเผ็ด และท็อปปิง</p></div><div class="page-actions"><button class="btn btn-primary" data-action="new-group">＋ เพิ่มกลุ่มตัวเลือก</button></div></div>
        <div class="cards-grid">${groups.map(group => {
          const groupOptions = options.filter(option => String(option.groupId) === String(group.groupId));
          const linked = links.filter(link => String(link.groupId) === String(group.groupId)).map(link => products.find(product => String(product.productId) === String(link.productId))).filter(Boolean);
          return `<section class="group-card"><div class="panel-head"><div><h4>${esc(group.name)}</h4><p>${group.selectionType === 'multiple' ? 'เลือกได้หลายรายการ' : 'เลือกได้ 1 รายการ'} · ${bool(group.isRequired) ? 'จำเป็นต้องเลือก' : 'ไม่บังคับ'}</p></div><button class="btn btn-ghost btn-sm" data-action="edit-group" data-id="${attr(group.groupId)}">แก้ไขกลุ่ม</button></div><div>${groupOptions.map(option => `<div class="order-mini"><div><b>${esc(option.name)}</b><small>${money(option.extraPrice)} · ${bool(option.isActive) ? 'เปิด' : 'ปิด'}</small></div></div>`).join('') || '<small class="helper">ยังไม่มีตัวเลือก</small>'}</div><div class="divider"></div><small class="helper">ใช้กับ: ${linked.length ? linked.map(p => esc(p.name)).join(', ') : 'ยังไม่ได้ผูกกับเมนู'}</small><div class="table-actions" style="margin-top:12px"><button class="btn btn-soft btn-sm" data-action="new-option" data-group-id="${attr(group.groupId)}">＋ เพิ่มตัวเลือก</button><button class="btn btn-ghost btn-sm" data-action="link-group" data-id="${attr(group.groupId)}">ผูกกับเมนู</button></div></section>`;
        }).join('')}</div>
        ${groups.length ? '' : empty('ยังไม่มีกลุ่มตัวเลือก', 'เพิ่มกลุ่ม เช่น เลือกเส้น หรือเลือกน้ำซุป')}
        <p class="helper" style="margin-top:14px">หมายเหตุ: API รุ่นปัจจุบันรองรับการผูกกลุ่มตัวเลือกเข้ากับเมนู แต่ยังไม่มีคำสั่งถอดการผูก หากต้องการลบความสัมพันธ์เดิมจะต้องเพิ่ม API ฝั่ง Code.gs</p>`;
    }

    function renderCustomers() {
      const customers = state.customers || [];
      return `<div class="page-head"><div><h2>สมาชิก</h2><p>ลูกค้าที่เข้าใช้งานผ่าน LINE MINI APP</p></div><div class="page-actions"><button class="btn btn-ghost" data-action="refresh-orders">↻ รีเฟรช</button></div></div>
        <div class="toolbar"><input id="customerSearch" placeholder="ค้นหาชื่อสมาชิกหรือ LINE User ID" value="${attr(state.customerQuery)}"><span class="helper">${customers.length} สมาชิก</span></div>
        <section class="content-card">${customers.length ? `<div class="table-wrap"><table><thead><tr><th>สมาชิก</th><th>LINE User ID</th><th>แต้มคงเหลือ</th><th>อัปเดตล่าสุด</th><th></th></tr></thead><tbody>${customers.map(customer => `<tr><td><b>${esc(customer.displayName || 'สมาชิก LINE')}</b><small>${thaiDateTime(customer.createdAt)}</small></td><td><code>${esc(shortLineId(customer.lineUserId))}</code></td><td><b>${number(customer.points)} แต้ม</b></td><td>${thaiDateTime(customer.updatedAt)}</td><td><button class="btn btn-ghost btn-sm" data-action="customer-detail" data-id="${attr(customer.lineUserId)}">ดูข้อมูล</button></td></tr>`).join('')}</tbody></table></div>` : empty('ยังไม่พบสมาชิก', 'ข้อมูลจะแสดงเมื่อลูกค้าเข้าใช้งานผ่าน LINE')}</section>`;
    }

    function renderPoints() {
      const settings = state.pointSettings || {};
      const tx = state.pointTransactions || [];
      const rewards = state.rewards || [];
      const redemptions = state.redemptions || [];
      const customerMap = new Map((state.customers || []).map(c => [c.lineUserId, c.displayName]));
      return `<div class="page-head"><div><h2>ระบบสมาชิกและสะสมแต้ม</h2><p>กำหนดเงื่อนไขคะแนน สร้าง QR และตรวจสอบธุรกรรม</p></div><div class="page-actions"><button class="btn btn-ghost" data-action="new-reward">＋ เพิ่มของรางวัล</button></div></div>
        <div class="settings-grid">
          <section class="setting-section"><div class="panel-head"><h3>เงื่อนไขการสะสมแต้ม</h3><span class="pill ${bool(settings.pointsEnabled) ? 'pill-ready' : 'pill-cancelled'}">${bool(settings.pointsEnabled) ? 'เปิดใช้งาน' : 'ปิดใช้งาน'}</span></div>
            <form id="pointSettingsForm">
              <label class="check-row"><input type="checkbox" name="pointsEnabled" ${bool(settings.pointsEnabled) ? 'checked' : ''}> เปิดระบบสะสมแต้ม</label>
              <div class="form-grid"><div class="field"><label>ยอดซื้อทุกกี่บาท</label><input name="bahtPerPoint" type="number" min="1" step="1" value="${attr(settings.bahtPerPoint || 25)}" required></div><div class="field"><label>ได้รับกี่แต้มต่อหน่วย</label><input name="pointsPerUnit" type="number" min="1" step="1" value="${attr(settings.pointsPerUnit || 1)}" required></div><div class="field"><label>ยอดซื้อขั้นต่ำ (บาท)</label><input name="minimumSpend" type="number" min="0" step="1" value="${attr(settings.minimumSpend || 25)}"></div><div class="field"><label>การคำนวณเศษเงิน</label><select name="roundingMode"><option value="floor" ${settings.roundingMode === 'floor' ? 'selected' : ''}>ปัดเศษลง</option><option value="carry" ${settings.roundingMode === 'carry' ? 'selected' : ''}>ทบยอดเศษเงิน</option></select></div></div>
              <p class="helper">ระบบรุ่นนี้ยังไม่รองรับวันหมดอายุแต้ม จึงกำหนดเป็นไม่มีวันหมดอายุ (0 เดือน)</p>
              <button class="btn btn-primary" type="button" data-action="save-point-settings">บันทึกเงื่อนไขแต้ม</button>
            </form>
          </section>
          <section class="setting-section"><h3>สะสมแต้มหน้าร้าน</h3><p class="helper">กรอกยอดซื้อ แล้วสร้าง QR ให้ลูกค้าสแกน ระบบจะบันทึกแต้มเมื่อสมาชิกสแกนสำเร็จ</p>
            <div class="field"><label>ยอดซื้อของลูกค้า (บาท)</label><input id="storeQrAmount" type="number" min="1" step="0.01" placeholder="เช่น 150"></div>
            <button class="btn btn-primary btn-block" data-action="create-store-qr">สร้าง QR ให้ลูกค้าสแกน</button>
            <div class="divider"></div>
            <div class="field"><label>สแกน QR ของลูกค้า</label><p class="helper">กรอกยอดซื้อก่อนเปิดกล้องสแกน QR ส่วนตัวของลูกค้า</p><input id="scanCustomerAmount" type="number" min="1" step="0.01" placeholder="ยอดซื้อ (บาท)"></div>
            <button class="btn btn-soft btn-block" data-action="open-customer-scanner">▣ เปิดกล้องสแกน QR ลูกค้า</button>
          </section>
        </div>
        <section class="panel" style="margin-top:15px"><div class="panel-head"><div><h3>ของรางวัลที่เปิดแลก</h3><small>รายการที่ลูกค้าเห็นในเมนูสะสมแต้ม</small></div><button class="btn btn-ghost btn-sm" data-action="new-reward">＋ เพิ่มรางวัล</button></div>
          ${rewards.length ? `<div class="reward-grid">${rewards.map(reward => `<article class="reward-card"><h4>${esc(reward.name)}</h4><p>${esc(reward.description || 'ไม่มีรายละเอียด')}</p><div class="divider"></div><div class="product-bottom"><b>${number(reward.pointsCost)} แต้ม</b><span class="helper">${number(reward.stock) < 0 ? 'ไม่จำกัด' : 'คงเหลือ ' + number(reward.stock)}</span></div><button class="btn btn-ghost btn-sm" style="margin-top:10px" data-action="edit-reward" data-id="${attr(reward.rewardId)}">แก้ไขรางวัล</button></article>`).join('')}</div>` : empty('ยังไม่มีของรางวัล', 'เพิ่มของรางวัลเพื่อให้ลูกค้าใช้แต้มแลก')}
        </section>
        <section class="panel" style="margin-top:15px"><div class="panel-head"><div><h3>ประวัติธุรกรรมแต้ม</h3><small>รายการเพิ่ม ลด และแลกแต้มล่าสุด</small></div><span class="pill pill-neutral">${tx.length} รายการ</span></div>
          ${tx.length ? `<div class="table-wrap"><table><thead><tr><th>วันที่</th><th>สมาชิก</th><th>ประเภทธุรกรรม</th><th>รายละเอียด</th><th>ยอดซื้อ</th><th>แต้ม</th></tr></thead><tbody>${tx.slice(0,100).map(item => `<tr><td>${thaiDateTime(item.createdAt)}</td><td>${esc(customerMap.get(item.lineUserId) || shortLineId(item.lineUserId))}</td><td>${esc(item.type || '-')}</td><td>${esc(item.description || '-')}</td><td>${money(item.amountSpent || 0)}</td><td><b class="${number(item.pointsChange) >= 0 ? 'text-positive' : 'text-negative'}">${number(item.pointsChange) > 0 ? '+' : ''}${number(item.pointsChange)}</b></td></tr>`).join('')}</tbody></table></div>` : empty('ยังไม่มีธุรกรรมแต้ม', 'เมื่อมีการสะสมหรือแลกแต้ม รายการจะแสดงที่นี่')}
        </section>
        <section class="panel" style="margin-top:15px"><div class="panel-head"><div><h3>คำขอแลกรางวัล</h3><small>ตรวจสอบและเปลี่ยนสถานะการแลก</small></div></div>
          ${redemptions.length ? `<div class="table-wrap"><table><thead><tr><th>วันที่</th><th>สมาชิก</th><th>ของรางวัล</th><th>แต้มที่ใช้</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody>${redemptions.map(item => `<tr><td>${thaiDateTime(item.createdAt)}</td><td>${esc(customerMap.get(item.lineUserId) || shortLineId(item.lineUserId))}</td><td>${esc(item.rewardName)}</td><td>${number(item.pointsCost)}</td><td><span class="pill ${item.status === 'COMPLETED' ? 'pill-ready' : item.status === 'REJECTED' ? 'pill-cancelled' : 'pill-new'}">${esc(item.status)}</span></td><td><div class="table-actions">${item.status === 'PENDING' || item.status === 'APPROVED' ? `<button class="btn btn-soft btn-sm" data-action="redemption-status" data-id="${attr(item.redemptionId)}" data-status="COMPLETED">สำเร็จ</button><button class="btn btn-danger btn-sm" data-action="redemption-status" data-id="${attr(item.redemptionId)}" data-status="REJECTED">ปฏิเสธ</button>` : '—'}</div></td></tr>`).join('')}</tbody></table></div>` : empty('ยังไม่มีคำขอแลกรางวัล', 'คำขอแลกของลูกค้าจะแสดงที่นี่')}
        </section>`;
    }

    function renderSettings() {
      const s = state.settings || {};
      return `<div class="page-head"><div><h2>ตั้งค่าร้านค้า</h2><p>ข้อมูลร้าน เวลาเปิดปิด และช่องทางรับชำระเงิน</p></div></div>
        <form data-form="settings">
          <div class="settings-grid">
            <section class="setting-section"><h3>ข้อมูลร้าน</h3><div class="form-grid"><div class="field span-2"><label>ชื่อร้าน</label><input name="storeName" value="${attr(s.storeName || 'ก๋วยเตี๋ยวโบราณ by เจ๊อ้น')}"></div><div class="field span-2"><label>คำอธิบายร้าน</label><textarea name="storeDescription">${esc(s.storeDescription || '')}</textarea></div><div class="field"><label>เบอร์โทรศัพท์</label><input name="storePhone" value="${attr(s.storePhone || '')}"></div><div class="field"><label>เวลาเปิด</label><input type="time" name="openTime" value="${attr(s.openTime || '08:00')}"></div><div class="field"><label>เวลาเปิดรับถึง</label><input type="time" name="closeTime" value="${attr(s.closeTime || '17:00')}"></div><div class="field span-2"><label>ที่อยู่ร้าน</label><textarea name="storeAddress">${esc(s.storeAddress || '')}</textarea></div></div></section>
            <section class="setting-section"><h3>สถานะและรูปแบบบริการ</h3>
              ${checkField('isStoreOpen', 'เปิดรับออเดอร์', s.isStoreOpen)}
              ${checkField('allowDineIn', 'รับประทานที่ร้าน', s.allowDineIn)}

    async function openOrderDetail(orderId) {

        const historyHtml = (order.statusHistory || []).map(history => `<div class="order-mini"><div><b>${esc(STATUS[history.newStatus] || history.newStatus)}</b><small>${thaiDateTime(history.createdAt)} · ${esc(history.actorType || '')}</small></div></div>`).join('');
        showModal('รายละเอียดออเดอร์ ' + order.orderId, `
          <div class="panel-head"><span class="pill ${statusClass(order.status)}">${esc(STATUS[order.status] || order.status)}</span><b style="font-family:Manrope;font-size:21px">${money(order.total)}</b></div>
          <div class="form-grid"><div><small class="helper">ลูกค้า</small><b>${esc(order.customerName || 'สมาชิก LINE')}</b></div><div><small class="helper">เวลาสั่ง</small><b>${thaiDateTime(order.createdAt)}</b></div><div><small class="helper">วิธีรับอาหาร</small><b>${orderTypeLabel(order.orderType)} ${order.tableNumber ? '· โต๊ะ ' + esc(order.tableNumber) : ''}</b></div><div><small class="helper">การชำระเงิน</small><b>${paymentLabel(order.paymentMethod)} · ${paymentStatusLabel(order.paymentStatus)}</b></div></div>
          <div class="divider"></div><h4>รายการอาหาร</h4>${itemsHtml || '<small class="helper">ไม่มีรายการสินค้า</small>'}
          <div class="divider"></div><div class="order-mini"><b>ยอดรวม</b><b>${money(order.subtotal || order.total)}</b></div><div class="order-mini"><b>ส่วนลด</b><b>${money(order.discount || 0)}</b></div><div class="order-mini"><b>ยอดสุทธิ</b><b>${money(order.total)}</b></div>
          ${order.note ? `<div class="divider"></div><b>หมายเหตุจากลูกค้า</b><p>${esc(order.note)}</p>` : ''}

          ${order.payment && order.payment.slipUrl ? `<p><a href="${attr(order.payment.slipUrl)}" target="_blank" rel="noopener">เปิดดูสลิปที่แนบ</a></p>` : ''}
          <div class="divider"></div><h4>ประวัติสถานะ</h4>${historyHtml || '<small class="helper">ยังไม่มีประวัติ</small>'}
          <div class="divider"></div><h4>ปรับสถานะออเดอร์</h4><div class="table-actions" style="flex-wrap:wrap;margin-top:10px">${actions || '<span class="helper">ไม่มีสถานะถัดไป</span>'}</div>`, { wide: true });
      } catch (error) { toast(error.message || 'เปิดรายละเอียดไม่สำเร็จ', 'error'); }

    function nextStatusActions(status, orderId) {
      const next = { NEW: ['ACCEPTED', 'CANCELLED'], ACCEPTED: ['PREPARING', 'CANCELLED'], PREPARING: ['READY', 'CANCELLED'], READY: ['COMPLETED', 'CANCELLED'] }[status] || [];
      return next.map(key => `<button class="btn ${key === 'CANCELLED' ? 'btn-danger' : 'btn-primary'} btn-sm" data-action="order-status" data-id="${attr(orderId)}" data-status="${key}">${key === 'CANCELLED' ? 'ยกเลิกออเดอร์' : STATUS[key]}</button>`).join('');
    }

    async function changeOrderStatus(orderId, status) {
      if (status === 'CANCELLED') {
        showModal('ยกเลิกคำสั่งซื้อ', `<form data-form="cancel-order"><input type="hidden" name="orderId" value="${attr(orderId)}"><div class="field"><label>เหตุผลการยกเลิก</label><textarea name="reason" required placeholder="ระบุเหตุผลที่ยกเลิก"></textarea></div><p class="helper">ระบบจะบันทึกเหตุผลและแจ้งลูกค้าผ่าน LINE</p><div class="modal-foot"><button type="button" class="btn btn-ghost" data-action="close-modal">กลับ</button><button class="btn btn-danger" type="submit">ยืนยันยกเลิก</button></div></form>`);
        return;
      }
      const confirmed = await confirmAction('เปลี่ยนสถานะเป็น ' + (STATUS[status] || status) + '?', 'ระบบจะบันทึกสถานะและส่ง Flex Message แจ้งลูกค้าอัตโนมัติ');
      if (!confirmed) return;
      await saveOrderStatus(orderId, status, '');
    }

    async function saveOrderStatus(orderId, status, reason) {
      try {
        await apiGuard('admin.updateOrderStatus', { orderId, status, note: reason || '', cancelReason: reason || '' });
        toast('อัปเดตสถานะออเดอร์แล้ว', 'success', 'ระบบส่งคำขอแจ้งเตือน LINE แล้ว');
        closeModal(); await refreshOverview();
        if (state.page !== 'overview') await loadOrders();
        render();
      } catch (error) { toast(error.message || 'เปลี่ยนสถานะไม่สำเร็จ', 'error'); }
    }

    async function changePaymentStatus(orderId, status) {
      const confirmed = await confirmAction('เปลี่ยนสถานะชำระเงิน?', 'ยืนยันตั้งค่าสถานะเป็น ' + status);
      if (!confirmed) return;
      try {
        await apiGuard('admin.updatePaymentStatus', { orderId, status });
        toast('อัปเดตสถานะชำระเงินแล้ว');
        closeModal(); await refreshOverview(); render();
      } catch (error) { toast(error.message || 'อัปเดตการชำระเงินไม่สำเร็จ', 'error'); }
    }

    async function uploadSelectedImage(file) {
      if (!file) return;
      if (!file.type.startsWith('image/')) { toast('กรุณาเลือกไฟล์รูปภาพ', 'error'); return; }
      if (file.size > 5 * 1024 * 1024) { toast('รูปภาพต้องมีขนาดไม่เกิน 5 MB', 'error'); return; }
      const status = $('#imageUploadStatus');
      if (status) status.textContent = 'กำลังอัปโหลดรูปภาพ...';
      try {
        const base64 = await fileToDataUrl(file);
        const result = await apiGuard('admin.uploadImage', { imageBase64: base64, fileName: file.name });
        $('#productImageUrl').value = result.url;
        if (status) status.textContent = 'อัปโหลดสำเร็จ ✓';
        toast('อัปโหลดรูปภาพแล้ว');
      } catch (error) { if (status) status.textContent = error.message; toast(error.message || 'อัปโหลดรูปไม่สำเร็จ', 'error'); }
    }

    function startStoreQrWatch(qr) {
      stopStoreQrWatch();
      const expiry = new Date(qr.expiresAt).getTime();
      state.storeQrTimer = setInterval(() => {
        const seconds = Math.max(0, Math.ceil((expiry - Date.now()) / 1000));
        const display = $('#storeQrCountdown');
        if (display) display.textContent = String(Math.floor(seconds / 60)).padStart(2, '0') + ':' + String(seconds % 60).padStart(2, '0');
        if (seconds <= 0 && state.storeQrPollTimer) { stopStoreQrWatch(); const status = $('#storeQrState'); if (status) status.textContent = 'QR หมดอายุแล้ว กรุณาสร้างใหม่'; }
      }, 1000);
      state.storeQrPollTimer = setInterval(async () => {
        if (!state.storeQr) return;
        try {
          const result = await adminApi('admin.getStorePointQRStatus', { qrToken: qr.qrToken });
          if (result.status === 'USED') {
            stopStoreQrWatch();
            $('#qrCodeMount')?.classList.add('hidden');
            $('#storeQrCountdown')?.classList.add('hidden');
            $('#storeQrState')?.classList.add('hidden');
            $('#storeQrSuccess')?.classList.remove('hidden');
            if ($('#storeQrEarned')) $('#storeQrEarned').textContent = '+' + number(result.pointsEarned) + ' แต้ม';
            if ($('#storeQrCustomer')) $('#storeQrCustomer').textContent = 'สมาชิก ' + shortLineId(result.customerLineUserId);
            toast('ลูกค้าสะสมแต้มสำเร็จแล้ว', 'success');
            await loadPointsData();
          } else if (result.status === 'EXPIRED') {
            stopStoreQrWatch(); if ($('#storeQrState')) $('#storeQrState').textContent = 'QR หมดอายุแล้ว';
          }
        } catch (error) { console.warn('Store QR status:', error); }
      }, 2500);
    }

    function stopStoreQrWatch() {
      if (state.storeQrPollTimer) clearInterval(state.storeQrPollTimer);
      if (state.storeQrTimer) clearInterval(state.storeQrTimer);
      state.storeQrPollTimer = null; state.storeQrTimer = null;
    }

    async function unlockAudio() {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        if (!state.audioContext) state.audioContext = new AudioContextClass();
        if (state.audioContext.state === 'suspended') await state.audioContext.resume();
        state.audioUnlocked = true;
      } catch (error) { console.warn('Audio unavailable:', error); }
    }

    function toggleSound() {
      state.soundEnabled = !state.soundEnabled;
      localStorage.setItem(CONFIG.SOUND_KEY, String(state.soundEnabled));
      $('#soundToggle').classList.toggle('on', state.soundEnabled);
      $('#soundLabel').textContent = state.soundEnabled ? 'เปิดเสียง' : 'ปิดเสียง';
      if (state.soundEnabled) unlockAudio();
      toast(state.soundEnabled ? 'เปิดเสียงแจ้งเตือนแล้ว' : 'ปิดเสียงแจ้งเตือนแล้ว');
    }

    function playOrderSound() {
      if (!state.soundEnabled || !state.audioUnlocked || !state.audioContext) return;
      try {
        const ctx = state.audioContext;
        const now = ctx.currentTime;
        [660, 880, 1046].forEach((frequency, index) => {
          const oscillator = ctx.createOscillator();
          const gain = ctx.createGain();
          oscillator.type = 'sine'; oscillator.frequency.value = frequency;
          gain.gain.setValueAtTime(0.0001, now + index * 0.14);
          gain.gain.exponentialRampToValueAtTime(0.15, now + index * 0.14 + 0.025);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + index * 0.14 + 0.2);
          oscillator.connect(gain); gain.connect(ctx.destination);
          oscillator.start(now + index * 0.14); oscillator.stop(now + index * 0.14 + 0.22);
        });
      } catch (error) { console.warn('Cannot play alert sound:', error); }
    }

    function closeModal() {

    function confirmAction(title, message) {
      return new Promise(resolve => {
        showModal(title, `<p>${esc(message)}</p><div class="modal-foot"><button class="btn btn-ghost" data-action="confirm-no">ยกเลิก</button><button class="btn btn-primary" data-action="confirm-yes">ยืนยัน</button></div>`);

    function toast(message, type = 'success', detail = '') {
      const root = $('#toastRoot');
      const item = document.createElement('div');
      item.className = 'toast' + (type === 'error' ? ' error' : type === 'warn' ? ' warn' : '');

      root.appendChild(item);
      setTimeout(() => item.remove(), 4500);
    }

    function exportOrdersCsv() {
      const headers = ['เลขออเดอร์', 'ชื่อลูกค้า', 'วันที่', 'ประเภทรับอาหาร', 'วิธีชำระเงิน', 'ยอดรวม', 'สถานะ'];
      const rows = state.orders.map(order => [order.orderId, order.customerName, order.createdAt, orderTypeLabel(order.orderType), paymentLabel(order.paymentMethod), order.total, STATUS[order.status] || order.status]);
      const csv = '\uFEFF' + [headers, ...rows].map(row => row.map(value => '"' + String(value == null ? '' : value).replace(/"/g, '""') + '"').join(',')).join('\r\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a'); link.href = url; link.download = 'jaeon-orders-' + new Date().toISOString().slice(0, 10) + '.csv';
      link.click(); URL.revokeObjectURL(url); toast('ส่งออก CSV แล้ว');
    }

    function empty(title, description) { return `<div class="empty-state"><div class="empty-icon">⌁</div><b>${esc(title)}</b><span>${esc(description || '')}</span></div>`; }
    function esc(value) { return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch])); }
    function attr(value) { return esc(value).replace(/`/g, '&#96;'); }
    function number(value) { const result = Number(value); return Number.isFinite(result) ? result : 0; }
    function bool(value) { return value === true || value === 1 || String(value).toLowerCase() === 'true' || String(value) === '1'; }
    function money(value) { return '฿' + number(value).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    function compactMoney(value) { const n = number(value); return n >= 1000 ? (n / 1000).toFixed(1) + 'k' : Math.round(n).toString(); }
    function statusClass(status) { return ({ NEW: 'pill-new', ACCEPTED: 'pill-accepted', PREPARING: 'pill-preparing', READY: 'pill-ready', COMPLETED: 'pill-completed', CANCELLED: 'pill-cancelled' })[status] || 'pill-neutral'; }
    function orderTypeLabel(type) { return ({ dinein: 'ทานที่ร้าน', takeaway: 'กลับบ้าน', delivery: 'จัดส่ง' })[String(type || '').toLowerCase()] || type || '-'; }
    function paymentLabel(method) { return ({ cash: 'เงินสด', promptpay: 'พร้อมเพย์', PROMPTPAY: 'พร้อมเพย์', CASH: 'เงินสด' })[method] || method || '-'; }
    function paymentStatusLabel(status) { return ({ UNPAID: 'ยังไม่ชำระ', PENDING: 'รอตรวจสอบ', VERIFIED: 'ตรวจสอบแล้ว', PAID: 'ชำระแล้ว', REJECTED: 'ไม่ผ่าน' })[status] || status || '-'; }
    function shortLineId(id) { const value = String(id || ''); return value.length > 14 ? value.slice(0, 7) + '…' + value.slice(-5) : value || '-'; }
    function thaiDateTime(value) { if (!value) return '-'; const date = new Date(value); if (Number.isNaN(date.getTime())) return esc(value); return date.toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' }); }
    function thaiDateShort(value) { const date = new Date(value + (String(value).length === 10 ? 'T12:00:00' : '')); if (Number.isNaN(date.getTime())) return value; return date.toLocaleDateString('th-TH', { day: 'numeric', month: 'short' }); }
    function fileToDataUrl(file) { return new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = () => reject(new Error('อ่านไฟล์รูปภาพไม่สำเร็จ')); reader.readAsDataURL(file); }); }

      if (action.dataset.action === 'save-link-group') {
        const groupId = action.dataset.id; const productId = $('#linkProductSelect') && $('#linkProductSelect').value;
        if (!productId) { toast('ไม่พบเมนูที่ยังไม่ได้ผูกกลุ่มนี้', 'warn'); return; }
        apiGuard('admin.linkProductOption', { productId, groupId, sortOrder: 0 }).then(async () => { toast('ผูกกลุ่มตัวเลือกแล้ว'); closeModal(); await loadCatalog(); render(); }).catch(error => toast(error.message, 'error'));
      }
      if (action.dataset.action === 'confirm-yes' || action.dataset.action === 'confirm-no') {
        const resolver = state.confirmResolver; state.confirmResolver = null; closeModal(); if (resolver) resolver(action.dataset.action === 'confirm-yes');
      }
    });

  </script>
</body>
</html>
